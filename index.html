<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Legacy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; margin: 0; }
        .nav-active { color: #eab308 !important; border-top: 2px solid #eab308; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .asset-card { background: linear-gradient(145deg, #111, #080808); border: 1px solid #222; border-radius: 20px; }
        .platform-chip { background: #151515; border: 1px solid #333; transition: 0.3s; }
        .platform-chip:active { border-color: #eab308; background: #1a1a0a; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; left: 50%; transform: translateX(-50%); }
        input, textarea { background: #111 !important; border: 1px solid #333 !important; color: #fff !important; border-radius: 14px !important; padding: 14px !important; margin-bottom: 12px; width: 100%; outline: none; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-32">
    <div class="max-w-md mx-auto px-6">
        
        <header class="py-8 flex justify-between items-center">
            <div>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest">Welcome Back</p>
                <h1 id="user-display-name" class="text-xl font-bold italic">User</h1>
            </div>
            <div class="h-12 w-12 bg-yellow-600/10 border border-yellow-600/20 rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-fingerprint text-yellow-500 text-xl"></i>
            </div>
        </header>

        <div id="page-vault" class="space-y-6">
            <div class="asset-card p-6">
                <h3 class="text-xs font-bold text-zinc-400 uppercase mb-4 tracking-tighter">Secure New Asset</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="openEntry('exchanges')" class="platform-chip py-4 rounded-xl flex flex-col items-center gap-2">
                        <i class="fa-solid fa-chart-line text-blue-500"></i><span class="text-[9px] font-bold">Exchange</span>
                    </button>
                    <button onclick="openEntry('wallets')" class="platform-chip py-4 rounded-xl flex flex-col items-center gap-2">
                        <i class="fa-solid fa-wallet text-orange-500"></i><span class="text-[9px] font-bold">Wallet</span>
                    </button>
                    <button onclick="openEntry('gaming')" class="platform-chip py-4 rounded-xl flex flex-col items-center gap-2">
                        <i class="fa-solid fa-gamepad text-green-500"></i><span class="text-[9px] font-bold">Gaming</span>
                    </button>
                </div>
            </div>

            <div id="assets-list" class="space-y-3">
                <p class="text-[10px] font-bold text-zinc-600 uppercase px-2">Your Secured Legacy</p>
                </div>
        </div>

        <div id="page-profile" class="hidden space-y-6">
            <div class="asset-card p-8 text-center">
                <div class="w-20 h-20 bg-zinc-900 rounded-full mx-auto mb-4 border-2 border-yellow-600/20 flex items-center justify-center">
                    <i class="fa-solid fa-user-shield text-3xl text-yellow-600"></i>
                </div>
                <h2 id="profile-email" class="text-lg font-bold">email@example.com</h2>
                <span class="text-[10px] bg-yellow-600/20 text-yellow-600 px-3 py-1 rounded-full font-bold uppercase">Pro Account</span>
            </div>

            <div class="asset-card p-6 space-y-4">
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-2">Settings & Security</h3>
                <button onclick="alert('Heir setup coming soon')" class="w-full flex justify-between items-center py-2 text-sm">
                    <span>Manage Heir (Next of Kin)</span><i class="fa-solid fa-chevron-right text-zinc-700"></i>
                </button>
                <button onclick="auth.signOut()" class="w-full flex justify-between items-center py-2 text-sm text-red-500">
                    <span>Logout Session</span><i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>

        <div id="entry-modal" class="hidden fixed inset-0 z-[200] flex items-end">
            <div class="absolute inset-0 bg-black/80" onclick="closeEntry()"></div>
            <div class="glass w-full rounded-t-[32px] p-8 animate-slide-up relative z-[201]">
                <div class="w-12 h-1 bg-zinc-800 mx-auto mb-6 rounded-full"></div>
                <h2 id="modal-title" class="text-xl font-bold mb-6 text-yellow-500">Secure Asset</h2>
                
                <div id="tag-selector" class="grid grid-cols-3 gap-2 mb-6"></div>
                <div id="form-fields"></div>
                
                <button onclick="saveAsset()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase mt-4">Save to Vault</button>
            </div>
        </div>

        <nav class="bottom-nav glass px-10 py-4 flex justify-between items-center rounded-t-3xl border-t border-white/10">
            <button onclick="showPage('vault')" id="nav-vault" class="flex flex-col items-center gap-1 nav-active pt-2">
                <i class="fa-solid fa-grid-2 text-xl"></i><span class="text-[9px] font-bold">VAULT</span>
            </button>
            <button onclick="showPage('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-zinc-600 pt-2">
                <i class="fa-solid fa-user text-xl"></i><span class="text-[9px] font-bold">PROFILE</span>
            </button>
        </nav>

    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let activeCat = "";
        let activeTag = "";

        const map = {
            exchanges: ['Binance', 'OKX', 'ByBit'],
            wallets: ['MetaMask', 'TrustWallet', 'Phantom'],
            gaming: ['Steam', 'Epic Games', 'PUBG']
        };

        function showPage(p) {
            document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('nav-' + p).classList.add('nav-active');
        }

        function openEntry(cat) {
            activeCat = cat;
            document.getElementById('entry-modal').classList.remove('hidden');
            const tags = document.getElementById('tag-selector');
            tags.innerHTML = "";
            map[cat].forEach(t => {
                tags.innerHTML += `<button onclick="setTag('${t}')" id="tag-${t}" class="platform-chip py-2 rounded-lg text-[10px] font-bold">${t}</button>`;
            });
        }

        function setTag(t) {
            activeTag = t;
            document.querySelectorAll('#tag-selector button').forEach(b => b.style.borderColor = "#333");
            document.getElementById('tag-' + t).style.borderColor = "#eab308";
            
            const fields = document.getElementById('form-fields');
            if(activeCat === 'wallets') {
                fields.innerHTML = `<input type="text" id="val1" placeholder="Wallet Name"><textarea id="val2" placeholder="Seed Phrase (12/24 words)" rows="3"></textarea>`;
            } else {
                fields.innerHTML = `<input type="text" id="val1" placeholder="Login ID/Email"><input type="password" id="val2" placeholder="Password">`;
            }
        }

        function closeEntry() { document.getElementById('entry-modal').classList.add('hidden'); }

        function saveAsset() {
            const v1 = document.getElementById('val1').value;
            const v2 = document.getElementById('val2').value;
            if(!activeTag || !v1 || !v2) return alert("Complete the form!");
            
            database.ref('vaults/' + auth.currentUser.uid).push({
                tag: activeTag, cat: activeCat, data: v1, date: new Date().toLocaleDateString()
            }).then(() => { closeEntry(); location.reload(); });
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('user-display-name').innerText = user.email.split('@')[0];
                document.getElementById('profile-email').innerText = user.email;
                fetchAssets(user.uid);
            } else { window.location.href = "index.html"; }
        });

        function fetchAssets(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('assets-list');
                snap.forEach(child => {
                    const item = child.val();
                    list.innerHTML += `
                        <div class="asset-card p-4 flex items-center justify-between border-l-4 border-yellow-600 mb-2">
                            <div><p class="text-[10px] text-zinc-500 font-bold uppercase">${item.cat}</p><h4 class="font-bold">${item.tag}</h4></div>
                            <i class="fa-solid fa-lock text-zinc-800"></i>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
