<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Legacy - Digital OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; margin: 0; overflow: hidden; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .glass-panel { background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; }
        
        /* In-App Browser Styles */
        #browser-overlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
        .browser-header { padding: 15px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        iframe { width: 100%; flex: 1; border: none; background: #fff; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 450px; left: 50%; transform: translateX(-50%); background: #080808; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 20px 0; z-index: 1000; }
        .access-card { background: linear-gradient(145deg, #151515, #0a0a0a); border-radius: 20px; border: 1px solid #222; transition: 0.3s; }
        .access-card:active { transform: scale(0.98); border-color: #eab308; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="browser-overlay">
        <div class="browser-header">
            <button onclick="closeBrowser()" class="text-zinc-400 text-xs uppercase font-black"><i class="fa-solid fa-xmark mr-2"></i> Close Gateway</button>
            <span id="browser-title" class="text-[10px] font-bold text-yellow-600 uppercase tracking-widest">Secure Access</span>
            <i class="fa-solid fa-lock text-green-500"></i>
        </div>
        <iframe id="web-frame" src=""></iframe>
    </div>

    <div class="app-container max-w-md mx-auto px-6">
        <header class="py-10 flex justify-between items-center">
            <div>
                <p class="text-yellow-600 text-[9px] font-black uppercase tracking-[0.4em] mb-1">Universal OS Active</p>
                <h1 class="text-2xl font-black italic tracking-tighter">DanishAlich07</h1>
            </div>
            <div class="h-10 w-10 glass-panel flex items-center justify-center"><i class="fa-solid fa-cloud text-yellow-500"></i></div>
        </header>

        <div class="main-content">
            <div class="grid grid-cols-4 gap-2 mb-10">
                <button onclick="openPanel('exchanges')" class="flex flex-col items-center gap-2">
                    <div class="h-14 w-14 glass-panel flex items-center justify-center border-b-2 border-blue-500"><i class="fa-solid fa-chart-line text-blue-500"></i></div>
                    <span class="text-[8px] font-bold uppercase">Trade</span>
                </button>
                <button onclick="openPanel('wallets')" class="flex flex-col items-center gap-2">
                    <div class="h-14 w-14 glass-panel flex items-center justify-center border-b-2 border-orange-500"><i class="fa-solid fa-wallet text-orange-500"></i></div>
                    <span class="text-[8px] font-bold uppercase">Web3</span>
                </button>
                <button onclick="openPanel('socials')" class="flex flex-col items-center gap-2">
                    <div class="h-14 w-14 glass-panel flex items-center justify-center border-b-2 border-pink-500"><i class="fa-solid fa-hashtag text-pink-500"></i></div>
                    <span class="text-[8px] font-bold uppercase">Social</span>
                </button>
                <button onclick="openPanel('gaming')" class="flex flex-col items-center gap-2">
                    <div class="h-14 w-14 glass-panel flex items-center justify-center border-b-2 border-green-500"><i class="fa-solid fa-gamepad text-green-500"></i></div>
                    <span class="text-[8px] font-bold uppercase">Gaming</span>
                </button>
            </div>

            <div id="vault-list" class="space-y-4">
                <p class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest border-b border-zinc-900 pb-2 italic">Your Unified Accounts</p>
            </div>
        </div>

        <div id="action-sheet" class="hidden fixed inset-0 z-[2000] flex items-end">
            <div class="absolute inset-0 bg-black/95" onclick="closePanel()"></div>
            <div class="glass-panel w-full rounded-t-[40px] p-10 relative z-[2001] border-t border-yellow-600/30">
                <div id="tag-grid" class="grid grid-cols-3 gap-2 mb-6"></div>
                <div id="form-box" class="hidden">
                    <input id="f1" placeholder="Account Email/ID">
                    <input id="f2" placeholder="Password/Key">
                    <button onclick="saveAsset()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase text-xs mt-2">Secure Permanently</button>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <div class="text-yellow-500 text-center"><i class="fa-solid fa-house-chimney-window text-xl"></i><br><span class="text-[8px] font-black uppercase">Home</span></div>
            <div class="text-zinc-600 text-center"><i class="fa-solid fa-user-gear text-xl"></i><br><span class="text-[8px] font-black uppercase">Profile</span></div>
        </nav>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        const accessMap = {
            exchanges: { tags: ['Binance', 'OKX', 'ByBit'], link: 'https://accounts.binance.com/' },
            wallets: { tags: ['MetaMask', 'TrustWallet'], link: 'https://portfolio.metamask.io/' },
            socials: { tags: ['YouTube', 'Instagram', 'TikTok'], link: 'https://studio.youtube.com/' },
            gaming: { tags: ['Steam', 'Epic', 'PUBG'], link: 'https://store.steampowered.com/login/' }
        };

        let activeCat = ""; let activeTag = "";

        function openPanel(cat) {
            activeCat = cat;
            document.getElementById('action-sheet').classList.remove('hidden');
            const grid = document.getElementById('tag-grid');
            grid.innerHTML = "";
            accessMap[cat].tags.forEach(t => {
                grid.innerHTML += `<button onclick="selectTag('${t}')" class="bg-[#111] border border-[#333] p-3 rounded-xl text-[9px] font-bold text-zinc-500">${t}</button>`;
            });
        }

        function selectTag(t) {
            activeTag = t;
            document.getElementById('form-box').classList.remove('hidden');
        }

        function saveAsset() {
            const v1 = document.getElementById('f1').value;
            const v2 = document.getElementById('f2').value;
            database.ref('vaults/' + auth.currentUser.uid).push({
                tag: activeTag, cat: activeCat, user: v1, pass: v2, link: accessMap[activeCat].link
            }).then(() => location.reload());
        }

        // BROWSER LOGIC
        function launchGateway(url, title) {
            document.getElementById('browser-overlay').style.display = 'flex';
            document.getElementById('web-frame').src = url;
            document.getElementById('browser-title').innerText = title + " Secure Gateway";
        }

        function closeBrowser() {
            document.getElementById('browser-overlay').style.display = 'none';
            document.getElementById('web-frame').src = "";
        }

        auth.onAuthStateChanged(user => { if(user) fetchList(user.uid); });

        function fetchList(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('vault-list');
                snap.forEach(child => {
                    const d = child.val();
                    list.innerHTML += `
                        <div onclick="launchGateway('${d.link}', '${d.tag}')" class="access-card p-5 flex justify-between items-center mb-3">
                            <div>
                                <p class="text-[8px] text-zinc-600 font-black uppercase mb-1">${d.cat}</p>
                                <h4 class="text-sm font-bold tracking-tight">${d.tag}</h4>
                                <p class="text-[10px] text-yellow-600/60 mt-1">${d.user}</p>
                            </div>
                            <div class="h-10 w-10 rounded-full bg-yellow-600/10 flex items-center justify-center border border-yellow-600/20">
                                <i class="fa-solid fa-arrow-right-to-bracket text-yellow-600"></i>
                            </div>
                        </div>`;
                });
            });
        }
        function closePanel() { document.getElementById('action-sheet').classList.add('hidden'); }
    </script>
</body>
</html>
