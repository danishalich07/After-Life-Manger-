<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amant Legacy OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --accent: #EAB308; --panel: #0F0F0F; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: white; margin: 0; overflow: hidden; }
        
        /* Premium UI Elements */
        .app-shell { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; background: #000; }
        .grid-icon { background: var(--panel); border: 1px solid #1A1A1A; border-radius: 22px; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 26px; transition: 0.2s; }
        .grid-icon:active { transform: scale(0.9); border-color: var(--accent); }
        
        /* Native Gateway Browser */
        #gateway-os { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; }
        iframe { width: 100%; flex: 1; border: none; background: #fff; border-radius: 30px 30px 0 0; }
        
        /* Functional Inputs */
        input { background: #0A0A0A !important; border: 1px solid #222 !important; color: white; border-radius: 16px; padding: 18px; width: 100%; margin-bottom: 12px; outline: none; }
        .btn-master { background: var(--accent); color: #000; font-weight: 800; padding: 20px; border-radius: 18px; width: 100%; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }

        .vault-card { background: var(--panel); border-radius: 20px; padding: 18px; border-left: 4px solid var(--accent); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="gateway-os">
        <div class="p-5 flex justify-between items-center bg-[#0A0A0A]">
            <button onclick="closeApp()" class="text-zinc-500 font-bold text-xs"><i class="fa-solid fa-arrow-left mr-2"></i> BACK TO VAULT</button>
            <span id="active-title" class="text-[10px] font-black uppercase tracking-widest text-yellow-500">Secure Access</span>
            <i class="fa-solid fa-shield-check text-green-500"></i>
        </div>
        <iframe id="os-frame" src=""></iframe>
    </div>

    <div class="app-shell">
        
        <div id="auth-screen" class="flex-1 flex flex-col justify-center px-10">
            <div class="text-center mb-12">
                <i class="fa-solid fa-fingerprint text-6xl text-yellow-500 mb-6"></i>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase">Amant <span class="text-yellow-500">OS</span></h1>
                <p class="text-zinc-600 text-[10px] font-bold uppercase tracking-[0.4em] mt-2">Legacy Access System</p>
            </div>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Master Access Key">
            <button onclick="handleLogin()" class="btn-master shadow-2xl shadow-yellow-600/10">Unlock Digital Life</button>
        </div>

        <div id="dashboard" class="hidden flex-1 overflow-y-auto">
            <header class="p-8 flex justify-between items-end">
                <div>
                    <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mb-1">Welcome Back</p>
                    <h2 class="text-2xl font-black italic" id="user-name">User</h2>
                </div>
                <div class="h-10 w-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center" onclick="auth.signOut()">
                    <i class="fa-solid fa-power-off text-xs text-red-500"></i>
                </div>
            </header>

            <div class="px-8 grid grid-cols-4 gap-6 mb-10">
                <div onclick="launch('https://accounts.binance.com/')" class="flex flex-col items-center gap-2">
                    <div class="grid-icon text-yellow-500"><i class="fa-solid fa-chart-line"></i></div>
                    <span class="text-[9px] font-bold text-zinc-500">Binance</span>
                </div>
                <div onclick="launch('https://portfolio.metamask.io/')" class="flex flex-col items-center gap-2">
                    <div class="grid-icon text-orange-500"><i class="fa-solid fa-wallet"></i></div>
                    <span class="text-[9px] font-bold text-zinc-500">Web3</span>
                </div>
                <div onclick="launch('https://studio.youtube.com/')" class="flex flex-col items-center gap-2">
                    <div class="grid-icon text-red-600"><i class="fa-brands fa-youtube"></i></div>
                    <span class="text-[9px] font-bold text-zinc-500">YouTube</span>
                </div>
                <div onclick="launch('https://store.steampowered.com/login/')" class="flex flex-col items-center gap-2">
                    <div class="grid-icon text-blue-500"><i class="fa-brands fa-steam"></i></div>
                    <span class="text-[9px] font-bold text-zinc-500">Gaming</span>
                </div>
            </div>

            <div class="px-8 space-y-4 pb-20">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[11px] font-black text-zinc-700 uppercase tracking-widest">Active Legacy Assets</h3>
                    <button onclick="openAddModal()" class="text-yellow-600 text-[10px] font-bold uppercase">+ Add New</button>
                </div>
                <div id="asset-list" class="space-y-3">
                    </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="hidden fixed inset-0 z-[20000] flex items-end">
        <div class="absolute inset-0 bg-black/95" onclick="this.parentElement.classList.add('hidden')"></div>
        <div class="bg-[#0A0A0A] w-full p-10 rounded-t-[40px] border-t border-zinc-800 z-[20001]">
            <input id="new-tag" placeholder="Platform Name (e.g. Facebook)">
            <input id="new-user" placeholder="Login ID / Email">
            <input id="new-pass" type="password" placeholder="Password / Key">
            <input id="new-link" placeholder="Login Link (https://...)">
            <button onclick="saveAsset()" class="btn-master mt-4">Seal Into Legacy</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_KEY = "AMANT_OS_2026_X";

        async function handleLogin() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); }
            catch { await auth.createUserWithEmailAndPassword(e, p); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('user-name').innerText = user.email.split('@')[0].toUpperCase();
                syncData(user.uid);
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        function syncData(uid) {
            db.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('asset-list');
                list.innerHTML = "";
                snap.forEach(child => {
                    const data = child.val();
                    const decryptedPass = CryptoJS.AES.decrypt(data.pass, MASTER_KEY).toString(CryptoJS.enc.Utf8);
                    list.innerHTML += `
                    <div class="vault-card flex justify-between items-center" onclick="launch('${data.link}', '${data.tag}')">
                        <div>
                            <h4 class="font-bold text-white uppercase text-xs tracking-tighter">${data.tag}</h4>
                            <p class="text-[10px] text-zinc-500 font-bold">${data.user}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-yellow-600 font-black mb-1">ENCRYPTED</p>
                            <i class="fa-solid fa-chevron-right text-zinc-800"></i>
                        </div>
                    </div>`;
                });
            });
        }

        function saveAsset() {
            const tag = document.getElementById('new-tag').value;
            const user = document.getElementById('new-user').value;
            const pass = document.getElementById('new-pass').value;
            const link = document.getElementById('new-link').value;
            const encPass = CryptoJS.AES.encrypt(pass, MASTER_KEY).toString();
            
            db.ref('vaults/' + auth.currentUser.uid).push({ tag, user, pass: encPass, link })
            .then(() => { document.getElementById('add-modal').classList.add('hidden'); });
        }

        function launch(url, title = "Secure Gateway") {
            document.getElementById('gateway-os').style.display = 'flex';
            document.getElementById('os-frame').src = url;
            document.getElementById('active-title').innerText = title;
        }

        function closeApp() { document.getElementById('gateway-os').style.display = 'none'; document.getElementById('os-frame').src = ""; }
        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    </script>
</body>
</html>
