<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Legacy - One-Tap Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; margin: 0; }
        .glass-panel { background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 28px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 450px; left: 50%; transform: translateX(-50%); background: #080808; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 20px 0; z-index: 1000; }
        .nav-item { color: #444; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #eab308; }
        .access-btn { background: linear-gradient(90deg, #eab308, #ca8a04); color: #000; padding: 8px 16px; border-radius: 12px; font-size: 10px; font-weight: 900; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.2); }
        input, textarea { background: #0a0a0a !important; border: 1px solid #222 !important; color: #fff !important; border-radius: 16px; padding: 16px; width: 100%; margin-bottom: 12px; outline: none; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="max-w-md mx-auto px-6">
        
        <header class="py-10 flex justify-between items-center">
            <div>
                <p class="text-yellow-600 text-[9px] font-black uppercase tracking-[0.4em] mb-1">Legacy Master System</p>
                <h1 class="text-2xl font-black italic text-white tracking-tighter">DanishAlich07</h1>
            </div>
            <div class="h-12 w-12 glass-panel flex items-center justify-center border-yellow-600/20">
                <i class="fa-solid fa-key text-yellow-500 text-lg"></i>
            </div>
        </header>

        <div id="view-vault">
            <div class="grid grid-cols-2 gap-4 mb-10">
                <button onclick="openPanel('exchanges')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-blue-600/40 text-center">
                    <i class="fa-solid fa-building-columns text-blue-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest leading-tight">Crypto<br>Exchanges</span>
                </button>
                <button onclick="openPanel('wallets')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-orange-600/40 text-center">
                    <i class="fa-solid fa-wallet text-orange-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest leading-tight">Web3<br>Wallets</span>
                </button>
                <button onclick="openPanel('socials')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-pink-600/40 text-center">
                    <i class="fa-solid fa-hashtag text-pink-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest leading-tight">Social<br>Profiles</span>
                </button>
                <button onclick="openPanel('gaming')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-green-600/40 text-center">
                    <i class="fa-solid fa-gamepad text-green-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest leading-tight">Gaming<br>Accounts</span>
                </button>
            </div>

            <div id="vault-list" class="space-y-4">
                <p class="text-[10px] font-bold text-zinc-700 uppercase tracking-widest border-b border-zinc-900 pb-2">Your Secured Legacy Assets</p>
            </div>
        </div>

        <div id="action-sheet" class="hidden fixed inset-0 z-[2000] flex items-end">
            <div class="absolute inset-0 bg-black/95" onclick="closePanel()"></div>
            <div class="glass-panel w-full rounded-t-[40px] p-10 relative z-[2001] border-t border-yellow-600/30 max-h-[85vh] overflow-y-auto">
                <div class="w-12 h-1 bg-zinc-800 mx-auto mb-8 rounded-full"></div>
                <div id="tag-grid" class="grid grid-cols-3 gap-2 mb-8"></div>
                <div id="form-box" class="hidden">
                    <div id="dynamic-fields"></div>
                    <button onclick="saveAsset()" class="w-full bg-yellow-600 text-black font-black py-5 rounded-2xl uppercase text-xs">Lock & Secure Access</button>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <div onclick="switchTab('vault')" id="t-vault" class="nav-item active"><i class="fa-solid fa-shield-halved text-xl"></i><br><span class="text-[8px] font-black uppercase mt-1">Vault</span></div>
            <div onclick="switchTab('profile')" id="t-profile" class="nav-item"><i class="fa-solid fa-user-gear text-xl"></i><br><span class="text-[8px] font-black uppercase mt-1">Profile</span></div>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let activeCat = ""; let activeTag = "";

        // ACCESS REGISTRY: Links & Instructions
        const accessRegistry = {
            exchanges: { tags: ['Binance', 'OKX', 'ByBit', 'KuCoin'], link: 'https://accounts.binance.com/en/login', tip: 'Check saved 2FA Phone Number.' },
            wallets: { tags: ['MetaMask', 'TrustWallet', 'Phantom', 'SafePal'], link: 'https://portfolio.metamask.io/', tip: 'Use Seed Phrase in new Wallet.' },
            socials: { tags: ['YouTube', 'TikTok', 'Instagram', 'Facebook'], link: 'https://studio.youtube.com/', tip: 'Use Backup Codes if 2FA fails.' },
            gaming: { tags: ['Steam', 'Epic Games', 'PUBG', 'PlayStation'], link: 'https://store.steampowered.com/login/', tip: 'Check linked Email for Steam Guard.' }
        };

        function switchTab(t) {
            document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + t).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('t-' + t).classList.add('active');
        }

        function openPanel(cat) {
            activeCat = cat;
            document.getElementById('action-sheet').classList.remove('hidden');
            const grid = document.getElementById('tag-grid');
            grid.innerHTML = "";
            accessRegistry[cat].tags.forEach(t => {
                grid.innerHTML += `<button onclick="selectTag('${t}')" id="tag-${t}" class="bg-[#111] border border-[#333] p-3 rounded-xl text-[10px] font-bold text-zinc-500 uppercase">${t}</button>`;
            });
            document.getElementById('form-box').classList.add('hidden');
        }

        function selectTag(t) {
            activeTag = t;
            document.getElementById('form-box').classList.remove('hidden');
            document.getElementById('dynamic-fields').innerHTML = `<input id="f1" placeholder="Login ID/Email"><input id="f2" placeholder="Password/Key/Secret">`;
        }

        function closePanel() { document.getElementById('action-sheet').classList.add('hidden'); }

        function saveAsset() {
            const v1 = document.getElementById('f1').value;
            const v2 = document.getElementById('f2').value;
            if(!v1 || !v2) return alert("Fill data!");
            
            database.ref('vaults/' + auth.currentUser.uid).push({
                tag: activeTag, 
                cat: activeCat, 
                user: v1, 
                link: accessRegistry[activeCat].link,
                tip: accessRegistry[activeCat].tip,
                date: new Date().toLocaleDateString()
            }).then(() => location.reload());
        }

        auth.onAuthStateChanged(user => { if(user) fetchList(user.uid); });

        function fetchList(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('vault-list');
                snap.forEach(child => {
                    const d = child.val();
                    list.innerHTML += `
                        <div class="glass-panel p-5 flex flex-col gap-3 mb-4 border-l-4 border-yellow-600">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-[8px] text-zinc-600 font-black uppercase">${d.cat}</p>
                                    <h4 class="text-sm font-bold tracking-tight">${d.tag}</h4>
                                </div>
                                <a href="${d.link}" target="_blank" class="access-btn">
                                    LOGIN GATEWAY <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                            <div class="bg-black/40 p-3 rounded-xl">
                                <p class="text-[9px] text-zinc-500 font-bold uppercase mb-1 italic">Pro Access Tip:</p>
                                <p class="text-[10px] text-yellow-600/80 font-medium">${d.tip}</p>
                            </div>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
