<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amant Legacy | Universal OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --gold: #EAB308; --bg: #050505; --card: #121212; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; }
        
        /* App Layout */
        .app-window { height: 100vh; display: flex; flex-direction: column; max-width: 450px; margin: 0 auto; background: var(--bg); position: relative; }
        .main-view { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        
        /* Premium UI Elements */
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; transition: 0.3s; }
        .category-card { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-bottom: 3px solid transparent; }
        .category-card.active { border-color: var(--gold); background: rgba(234, 179, 8, 0.05); }
        
        /* Integrated Gateway Browser */
        #gateway { position: fixed; inset: 0; background: black; z-index: 9999; display: none; flex-direction: column; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        iframe { width: 100%; flex: 1; border: none; background: white; border-radius: 30px 30px 0 0; }

        /* Custom Inputs */
        input { background: #0a0a0a !important; border: 1px solid #222 !important; color: white !important; border-radius: 15px; padding: 15px; width: 100%; outline: none; margin-bottom: 10px; }
        .btn-gold { background: var(--gold); color: black; font-weight: 800; padding: 16px; border-radius: 15px; width: 100%; text-transform: uppercase; font-size: 12px; }
        
        .nav-bar { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 20px; background: rgba(5,5,5,0.95); backdrop-filter: blur(10px); border-top: 1px solid #111; }
        .nav-btn { color: #444; text-align: center; font-size: 20px; }
        .nav-btn.active { color: var(--gold); }
    </style>
</head>
<body>

<div class="app-window" id="auth-screen">
    <div class="flex-1 flex flex-col justify-center px-10">
        <div class="text-center mb-10">
            <i class="fa-solid fa-shield-halved text-5xl text-yellow-500 mb-4"></i>
            <h1 class="text-3xl font-extrabold italic tracking-tighter">AMANT OS</h1>
            <p class="text-zinc-500 text-[10px] uppercase tracking-widest mt-2">Professional Legacy Vault</p>
        </div>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Master Password">
        <button onclick="handleAuth()" class="btn-gold mt-4 shadow-lg">Access Software</button>
        <p class="text-center text-zinc-600 text-[11px] mt-6 uppercase cursor-pointer" onclick="isLogin = !isLogin; this.innerText = isLogin ? 'Need an Account? Create Key' : 'Have Access? Unlock'">Need an Account? Create Key</p>
    </div>
</div>

<div class="app-window hidden" id="main-app">
    <header class="p-6 flex justify-between items-center">
        <div>
            <h2 class="text-xl font-black italic" id="user-display">DanishAlich07</h2>
            <div class="flex items-center gap-2 mt-1">
                <span class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest">Cloud Encrypted</span>
            </div>
        </div>
        <button onclick="auth.signOut()" class="text-zinc-600"><i class="fa-solid fa-power-off"></i></button>
    </header>

    <div class="main-view">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div onclick="showAddPanel('exchanges')" class="glass category-card"><i class="fa-solid fa-chart-pie text-blue-500 text-xl"></i><span class="text-[10px] font-bold uppercase">Exchanges</span></div>
            <div onclick="showAddPanel('socials')" class="glass category-card"><i class="fa-solid fa-hashtag text-pink-500 text-xl"></i><span class="text-[10px] font-bold uppercase">Socials</span></div>
            <div onclick="showAddPanel('wallets')" class="glass category-card"><i class="fa-solid fa-wallet text-orange-500 text-xl"></i><span class="text-[10px] font-bold uppercase">Wallets</span></div>
            <div onclick="showAddPanel('gaming')" class="glass category-card"><i class="fa-solid fa-gamepad text-green-500 text-xl"></i><span class="text-[10px] font-bold uppercase">Gaming</span></div>
        </div>

        <div id="assets-container" class="space-y-4">
            <h3 class="text-[10px] font-black text-zinc-700 uppercase tracking-[0.3em] mb-4">Secured Gateways</h3>
            </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn active"><i class="fa-solid fa-house-user"></i></div>
        <div class="nav-btn"><i class="fa-solid fa-fingerprint"></i></div>
        <div class="nav-btn"><i class="fa-solid fa-clock-rotate-left"></i></div>
    </nav>
</div>

<div id="gateway">
    <div class="p-4 flex justify-between items-center">
        <button onclick="closeGateway()" class="text-zinc-400 font-bold text-xs uppercase"><i class="fa-solid fa-xmark mr-2"></i> Close</button>
        <span id="gateway-title" class="text-[10px] font-black uppercase text-yellow-500 tracking-widest">Secure Login</span>
        <i class="fa-solid fa-lock text-green-600"></i>
    </div>
    <iframe id="gateway-frame" src=""></iframe>
</div>

<div id="add-modal" class="hidden fixed inset-0 z-[5000] flex items-end">
    <div class="absolute inset-0 bg-black/90" onclick="this.parentElement.classList.add('hidden')"></div>
    <div class="glass w-full p-8 rounded-t-[40px] relative z-[5001] border-t border-yellow-600/30">
        <div class="w-12 h-1 bg-zinc-800 mx-auto mb-6"></div>
        <h2 id="modal-title" class="text-lg font-bold mb-4 uppercase text-center">Add Platform</h2>
        <div id="tag-cloud" class="flex flex-wrap gap-2 mb-6 justify-center"></div>
        <div id="inputs" class="hidden">
            <input id="u_name" placeholder="Login ID / Email">
            <input id="u_pass" type="password" placeholder="Password / Key">
            <button onclick="saveToCloud()" class="btn-gold">Lock in Software</button>
        </div>
    </div>
</div>

<script>
    // Firebase Security Logic
    const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const SECRET = "LEGACY_OS_PRO_2026";

    let isLogin = true;
    let selectedCat = "";
    let selectedTag = "";

    const masterMap = {
        exchanges: { tags: ['Binance', 'OKX', 'ByBit', 'KuCoin', 'Bitget', 'Mexc'], url: 'https://accounts.binance.com/' },
        socials: { tags: ['YouTube', 'TikTok', 'Instagram', 'Facebook', 'X', 'Discord'], url: 'https://studio.youtube.com/' },
        wallets: { tags: ['MetaMask', 'TrustWallet', 'Phantom', 'SafePal', 'Ledger'], url: 'https://portfolio.metamask.io/' },
        gaming: { tags: ['Steam', 'Epic Games', 'PUBG', 'FreeFire', 'PlayStation'], url: 'https://store.steampowered.com/login/' }
    };

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        try {
            if(isLogin) await auth.signInWithEmailAndPassword(email, pass);
            else await auth.createUserWithEmailAndPassword(email, pass);
        } catch(e) { alert(e.message); }
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = user.email.split('@')[0];
            fetchData(user.uid);
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }
    });

    function showAddPanel(cat) {
        selectedCat = cat;
        document.getElementById('add-modal').classList.remove('hidden');
        const cloud = document.getElementById('tag-cloud');
        cloud.innerHTML = "";
        masterMap[cat].tags.forEach(t => {
            cloud.innerHTML += `<button onclick="pickTag('${t}')" class="bg-[#1a1a1a] px-4 py-2 rounded-full text-[10px] font-bold border border-zinc-800">${t}</button>`;
        });
        document.getElementById('inputs').classList.add('hidden');
    }

    function pickTag(t) {
        selectedTag = t;
        document.getElementById('inputs').classList.remove('hidden');
        document.getElementById('modal-title').innerText = "Securing " + t;
    }

    function saveToCloud() {
        const u = document.getElementById('u_name').value;
        const p = document.getElementById('u_pass').value;
        const enc_u = CryptoJS.AES.encrypt(u, SECRET).toString();
        const enc_p = CryptoJS.AES.encrypt(p, SECRET).toString();

        db.ref('vaults/' + auth.currentUser.uid).push({
            cat: selectedCat, tag: selectedTag, u: enc_u, p: enc_p, link: masterMap[selectedCat].url
        }).then(() => location.reload());
    }

    function fetchData(uid) {
        db.ref('vaults/' + uid).on('value', snap => {
            const container = document.getElementById('assets-container');
            container.innerHTML = `<h3 class="text-[10px] font-black text-zinc-700 uppercase tracking-[0.3em] mb-4 italic">Secured Gateways</h3>`;
            snap.forEach(child => {
                const item = child.val();
                const dec_u = CryptoJS.AES.decrypt(item.u, SECRET).toString(CryptoJS.enc.Utf8);
                container.innerHTML += `
                <div onclick="openGateway('${item.link}', '${item.tag}')" class="glass p-5 flex justify-between items-center">
                    <div>
                        <p class="text-[8px] text-zinc-500 font-bold uppercase">${item.cat}</p>
                        <h4 class="font-bold text-white">${item.tag}</h4>
                        <p class="text-[10px] text-yellow-500/70 mt-1">${dec_u}</p>
                    </div>
                    <i class="fa-solid fa-circle-chevron-right text-zinc-800"></i>
                </div>`;
            });
        });
    }

    function openGateway(url, title) {
        document.getElementById('gateway').style.display = 'flex';
        document.getElementById('gateway-frame').src = url;
        document.getElementById('gateway-title').innerText = title + " Professional Gateway";
    }

    function closeGateway() {
        document.getElementById('gateway').style.display = 'none';
        document.getElementById('gateway-frame').src = "";
    }
</script>
</body>
</html>
