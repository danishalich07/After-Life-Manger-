<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANAT | Global Digital Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #d4d4d8; }
        .vault-card { background: linear-gradient(145deg, #0f0f0f, #18181b); border: 1px solid #27272a; border-radius: 2rem; }
        .hidden { display: none; }
        .safe-input { background: #000; border: 1px solid #3f3f46; color: #fbbf24; font-family: monospace; }
        input:focus { border-color: #eab308 !important; }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-md mx-auto p-5 space-y-6">
        <header class="flex justify-between items-center py-6">
            <div>
                <h1 class="text-3xl font-black text-yellow-500 italic tracking-tighter">AMANAT</h1>
                <p id="userUID" class="text-[9px] text-zinc-500 font-mono uppercase">Protocol: Ready</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] bg-yellow-500/10 text-yellow-500 px-3 py-1 rounded-full border border-yellow-500/20 font-bold uppercase">Email Secured</span>
            </div>
        </header>

        <div id="auth-section" class="vault-card p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-6 uppercase italic">Identity Verification</h2>
            <div class="space-y-4">
                <input type="text" id="reg-name" placeholder="Full Legal Name" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none transition-all">
                <input type="email" id="reg-email" placeholder="Gmail / Email Address" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none transition-all">
                <input type="password" id="reg-pass" placeholder="Master Vault Key (8+ Chars)" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none">
                
                <button onclick="handleSignup()" id="btn-auth" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all">
                    Initialize Protocol
                </button>
                <p class="text-[9px] text-center text-zinc-500 uppercase font-bold">A verification link will be sent to your email.</p>
            </div>
        </div>

        <div id="verify-msg" class="hidden vault-card p-8 text-center space-y-4">
            <i class="fa-solid fa-envelope-open-text text-5xl text-yellow-500 animate-bounce"></i>
            <h3 class="text-xl font-bold text-white">Check Your Inbox</h3>
            <p class="text-sm text-zinc-400">Humne aapki Gmail par ek verification link bheja hai. Link par click karne ke baad aapka Vault activate ho jayega.</p>
            <button onclick="location.reload()" class="text-yellow-500 text-xs font-bold uppercase underline">Back to Login</button>
        </div>

        <div id="digital-safe" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div onclick="openSafe('BTC/Crypto Seed')" class="vault-card p-6 text-center cursor-pointer border-yellow-500/30">
                    <i class="fa-brands fa-bitcoin text-3xl text-orange-500 mb-2"></i>
                    <p class="text-[10px] font-bold uppercase">Crypto Safe</p>
                </div>
                <div onclick="openSafe('Social/Master IDs')" class="vault-card p-6 text-center cursor-pointer">
                    <i class="fa-solid fa-key text-3xl text-blue-500 mb-2"></i>
                    <p class="text-[10px] font-bold uppercase">App Access</p>
                </div>
            </div>

            <div class="vault-card p-6 border-l-4 border-l-yellow-600">
                <h3 id="safe-title" class="text-sm font-black uppercase mb-4 italic text-yellow-500">Safe: Idle</h3>
                <textarea id="secret-data" rows="4" placeholder="Enter Private Keys or Passwords..." class="w-full safe-input p-4 rounded-xl outline-none text-xs mb-4"></textarea>
                <button onclick="encryptAndSave()" class="w-full bg-yellow-600 text-black font-black py-3 rounded-xl text-[10px] uppercase">Encrypt & Lock</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration (Using Auth + Database)
        const firebaseConfig = {
            apiKey: "AIzaSyAs-YOUR_ACTUAL_API_KEY", // Yahan apni Firebase API Key lagayein
            authDomain: "amant-manger.firebaseapp.com",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com",
            projectId: "amant-manger",
            storageBucket: "amant-manger.appspot.com",
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        async function handleSignup() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;

            if(!email || pass.length < 8) return alert("Email valid ho aur password 8 chars ka!");

            try {
                // 1. Create User
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                // 2. Send Verification Email
                await user.sendEmailVerification();

                // 3. Save to Database
                await database.ref('users/' + user.uid).set({
                    fullName: name,
                    email: email,
                    status: "pending_verification",
                    createdAt: new Date().getTime()
                });

                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('verify-msg').classList.remove('hidden');

            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        // Check if user is verified on return
        auth.onAuthStateChanged((user) => {
            if (user && user.emailVerified) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('digital-safe').classList.remove('hidden');
                document.getElementById('userUID').innerText = "UID: " + user.uid.substr(0,8).toUpperCase();
            }
        });

        function openSafe(cat) {
            document.getElementById('safe-title').innerText = "Safe: " + cat;
        }

        function encryptAndSave() {
            const data = document.getElementById('secret-data').value;
            const user = auth.currentUser;
            if(!data || !user) return alert("Data empty ya user login nahi!");

            const encrypted = CryptoJS.AES.encrypt(data, "USER_MASTER_KEY").toString();
            database.ref('vaults/' + user.uid).push({
                payload: encrypted,
                category: document.getElementById('safe-title').innerText,
                timestamp: new Date().getTime()
            });
            alert("Data Encrypted & Saved!");
            document.getElementById('secret-data').value = "";
        }
    </script>
</body>
</html>
