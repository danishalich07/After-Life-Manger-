<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assets Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #d4d4d8; }
        .vault-card { background: linear-gradient(145deg, #0f0f0f, #18181b); border: 1px solid #27272a; border-radius: 2rem; }
        .hidden { display: none; }
        .tab-active { border-bottom: 2px solid #eab308; color: #eab308; }
        .input-style { background: #000; border: 1px solid #27272a; padding: 1rem; border-radius: 1rem; width: 100%; color: white; outline: none; }
    </style>
</head>
<body class="pb-20">
    <div class="max-w-md mx-auto p-5 space-y-6">
        <header class="flex flex-col items-center py-6 text-center">
            <h1 class="text-2xl font-black text-yellow-500 italic uppercase">Digital Assets Manager</h1>
            <p class="text-[10px] text-zinc-500 tracking-widest uppercase">Username Access Protocol</p>
            <button id="logout-btn" onclick="logout()" class="hidden mt-4 text-[10px] bg-zinc-800 px-3 py-1 rounded-lg text-red-400 font-bold">LOGOUT</button>
        </header>

        <div id="auth-container" class="vault-card p-8 shadow-2xl">
            <div class="flex justify-around mb-8 border-b border-zinc-800">
                <button id="tab-login" onclick="switchAuthTab('login')" class="pb-2 text-sm font-bold uppercase tab-active">Login</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="pb-2 text-sm font-bold uppercase text-zinc-600">Signup</button>
            </div>
            
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-user" placeholder="Enter Username" class="input-style">
                <input type="password" id="login-pass" placeholder="Password" class="input-style">
                <button onclick="handleLogin()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase shadow-lg active:scale-95">Access Vault</button>
            </div>

            <div id="signup-form" class="hidden space-y-4">
                <input type="text" id="reg-user" placeholder="Create Unique Username" class="input-style">
                <input type="password" id="reg-pass" placeholder="Create Password" class="input-style">
                <button onclick="handleSignup()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase shadow-lg active:scale-95">Register User</button>
            </div>
        </div>

        <div id="digital-safe" class="hidden space-y-6">
            <div class="vault-card p-6 border-l-4 border-l-yellow-600">
                <h3 class="text-sm font-black uppercase mb-4 text-yellow-500">Secure Assets</h3>
                <textarea id="secret-data" rows="4" placeholder="Put your secret information here..." class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-yellow-500 outline-none font-mono"></textarea>
                <button onclick="encryptAndSave()" class="w-full bg-yellow-600 text-black font-black py-3 rounded-xl uppercase mt-2">Encrypt & Save</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0",
            authDomain: "amant-manger.firebaseapp.com",
            projectId: "amant-manger",
            storageBucket: "amant-manger.firebasestorage.app",
            messagingSenderId: "1069118851611",
            appId: "1:1069118851611:web:7087758e6d7c2bd91106be",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        function switchAuthTab(tab) {
            document.getElementById('login-form').classList.toggle('hidden', tab === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', tab === 'login');
            document.getElementById('tab-login').classList.toggle('tab-active', tab === 'login');
            document.getElementById('tab-signup').classList.toggle('tab-active', tab === 'signup');
        }

        async function handleSignup() {
            const user = document.getElementById('reg-user').value;
            const pass = document.getElementById('reg-pass').value;
            if(!user || !pass) return alert("Fields cannot be empty");
            
            // Converting username to dummy email format for Firebase
            const fakeEmail = user.trim() + "@amant.com";
            try {
                await auth.createUserWithEmailAndPassword(fakeEmail, pass);
                alert("Username Registered!");
            } catch (e) { alert("Error: Use a unique username"); }
        }

        async function handleLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const fakeEmail = user.trim() + "@amant.com";
            try {
                await auth.signInWithEmailAndPassword(fakeEmail, pass);
            } catch (e) { alert("Wrong Username or Password"); }
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('digital-safe').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
            }
        });

        function logout() { auth.signOut(); location.reload(); }

        function encryptAndSave() {
            const data = document.getElementById('secret-data').value;
            if(!data) return alert("Enter some data first");
            const encrypted = CryptoJS.AES.encrypt(data, "VAULT_KEY_2026").toString();
            database.ref('vaults/' + auth.currentUser.uid).push({ payload: encrypted, time: Date.now() })
            .then(() => alert("Asset Secured!"));
        }
    </script>
</body>
</html>
