<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assets Security Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #d4d4d8; }
        .vault-card { background: linear-gradient(145deg, #0f0f0f, #18181b); border: 1px solid #27272a; border-radius: 2rem; }
        .hidden { display: none; }
        .tab-active { border-bottom: 2px solid #eab308; color: #eab308; }
        .input-style { background: #000; border: 1px solid #27272a; padding: 1rem; border-radius: 1rem; width: 100%; outline: none; color: white; }
        .input-style:focus { border-color: #eab308; }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-md mx-auto p-5 space-y-6">
        <header class="flex flex-col items-center py-6 text-center">
            <h1 class="text-2xl font-black text-yellow-500 italic tracking-tighter uppercase leading-tight">Digital Assets Security Manager</h1>
            <p class="text-[9px] text-zinc-500 font-mono tracking-[0.3em] mt-1">Institutional Grade Protection</p>
            <button id="logout-btn" onclick="logout()" class="hidden mt-4 text-[10px] bg-zinc-800 px-3 py-1 rounded-lg uppercase font-bold">Logout</button>
        </header>

        <div id="auth-container" class="vault-card p-8 shadow-2xl">
            <div class="flex justify-around mb-8 border-b border-zinc-800">
                <button id="tab-login" onclick="switchAuthTab('login')" class="pb-2 text-sm font-bold uppercase tab-active transition-all">Login</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="pb-2 text-sm font-bold uppercase text-zinc-600 transition-all">Signup</button>
            </div>

            <div id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email Address" class="input-style">
                <input type="password" id="login-pass" placeholder="Master Password" class="input-style">
                <button onclick="handleLogin()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all">Access Vault</button>
            </div>

            <div id="signup-form" class="hidden space-y-4">
                <input type="text" id="reg-name" placeholder="Full Legal Name" class="input-style">
                <input type="email" id="reg-email" placeholder="Gmail Address" class="input-style">
                <input type="password" id="reg-pass" placeholder="Create Master Key (8+ Chars)" class="input-style">
                <button onclick="handleSignup()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all">Initialize Protocol</button>
            </div>
        </div>

        <div id="verify-msg" class="hidden vault-card p-8 text-center space-y-4">
            <i class="fa-solid fa-envelope-circle-check text-5xl text-yellow-500 animate-pulse"></i>
            <h3 class="text-xl font-bold text-white uppercase italic">Verify Identity</h3>
            <p class="text-sm text-zinc-400">Humnay aapki Gmail par verification link bheja hai. Activation ke liye us par click karein.</p>
            <button onclick="location.reload()" class="text-yellow-500 font-black uppercase text-xs underline mt-4">I Have Verified</button>
        </div>

        <div id="digital-safe" class="hidden space-y-6">
            <div class="vault-card p-6 border-l-4 border-l-yellow-600">
                <h3 class="text-sm font-black uppercase mb-4 text-yellow-500 italic">Asset Security Vault</h3>
                <textarea id="secret-data" rows="5" placeholder="Private keys, Seed phrases, or Passwords..." class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-xs mb-4 text-yellow-500 font-mono focus:border-yellow-600 outline-none"></textarea>
                <button onclick="encryptAndSave()" class="w-full bg-yellow-600 text-black font-black py-3 rounded-xl text-[10px] uppercase tracking-widest transition-all">Encrypt & Secure Asset</button>
            </div>
        </div>
    </div>

    <script>
        // Updated with your Real Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0",
            authDomain: "amant-manger.firebaseapp.com",
            projectId: "amant-manger",
            storageBucket: "amant-manger.firebasestorage.app",
            messagingSenderId: "1069118851611",
            appId: "1:1069118851611:web:7087758e6d7c2bd91106be",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        function switchAuthTab(tab) {
            document.getElementById('login-form').classList.toggle('hidden', tab === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', tab === 'login');
            document.getElementById('tab-login').classList.toggle('tab-active', tab === 'login');
            document.getElementById('tab-signup').classList.toggle('tab-active', tab === 'signup');
        }

        async function handleSignup() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;
            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, pass);
                await userCred.user.sendEmailVerification();
                await database.ref('users/' + userCred.user.uid).set({ fullName: name, email: email, status: 'Active' });
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('verify-msg').classList.remove('hidden');
            } catch (e) { alert("Error: " + e.message); }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                const userCred = await auth.signInWithEmailAndPassword(email, pass);
                if(!userCred.user.emailVerified) {
                    auth.signOut();
                    return alert("Identity Pending: Pehle Gmail par aaya link verify karein!");
                }
            } catch (e) { alert("Error: " + e.message); }
        }

        auth.onAuthStateChanged((user) => {
            if (user && user.emailVerified) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('digital-safe').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
            }
        });

        function logout() { auth.signOut(); location.reload(); }

        function encryptAndSave() {
            const data = document.getElementById('secret-data').value;
            const user = auth.currentUser;
            if(!data) return alert("Safe cannot be locked empty!");
            const encrypted = CryptoJS.AES.encrypt(data, "VAULT_2026_SECURITY").toString();
            database.ref('vaults/' + user.uid).push({ payload: encrypted, timestamp: new Date().getTime() });
            alert("ASSET SECURED!");
            document.getElementById('secret-data').value = "";
        }
    </script>
</body>
</html>
