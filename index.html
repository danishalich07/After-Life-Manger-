<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANAT | Global Secure Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-red { box-shadow: 0 0 20px rgba(220, 38, 38, 0.5); }
        .hidden { display: none; }
        select option { background: #18181b; color: white; }
    </style>
</head>
<body class="bg-black text-gray-200 font-sans pb-24">

    <div class="max-w-md mx-auto p-4 space-y-6">
        <header class="flex justify-between items-center py-6 bg-zinc-950/50 sticky top-0 z-50 backdrop-blur-md px-2">
            <div>
                <h1 class="text-3xl font-black text-yellow-500 italic">AMANAT</h1>
                <p id="userUID" class="text-[9px] text-gray-500 font-mono">UID: LOADING...</p>
            </div>
            <div class="text-right">
                <p class="text-[8px] text-gray-500 uppercase tracking-widest">Global Status</p>
                <span class="text-[10px] text-green-500 font-bold tracking-tighter">● PROTECTED</span>
            </div>
        </header>
        
        <div id="auth-container" class="bg-zinc-900 rounded-[2.5rem] border border-zinc-800 shadow-2xl p-6">
            <div id="step-1">
                <h2 class="text-2xl font-black text-yellow-500 italic mb-2">GLOBAL SIGNUP</h2>
                <p class="text-zinc-400 text-[10px] mb-6 uppercase font-bold tracking-widest">Select country & enter details</p>
                
                <div class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Full Name" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600">
                    <input type="email" id="reg-email" placeholder="Email Address" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600">
                    
                    <div class="flex gap-2">
                        <select id="country-code" class="w-1/3 bg-black border border-zinc-800 p-4 rounded-2xl text-white text-xs outline-none focus:border-yellow-600">
                            <option value="+92">🇵🇰 +92 (PK)</option>
                            <option value="+971">🇦🇪 +971 (AE)</option>
                            <option value="+1">🇺🇸 +1 (US)</option>
                            <option value="+44">🇬🇧 +44 (UK)</option>
                            <option value="+91">🇮🇳 +91 (IN)</option>
                            <option value="+ Saudi Arabia">+966 (SA)</option>
                            <option value="+90">🇹🇷 +90 (TR)</option>
                            </select>
                        <input type="tel" id="user-phone-input" placeholder="3001234567" class="w-2/3 bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600">
                    </div>

                    <div>
                        <input type="password" id="reg-password" placeholder="Create Password (Min. 8 chars)" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600">
                        <p id="pass-hint" class="text-[8px] text-zinc-500 mt-1 ml-2">Must be at least 8 words/characters long.</p>
                    </div>
                    
                    <button onclick="sendOTP()" id="btn-send" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                        GET OTP CODE
                    </button>
                </div>
            </div>

            <div id="step-2" class="hidden text-center">
                <h2 class="text-2xl font-black text-green-500 italic mb-2">VERIFYING...</h2>
                <p class="text-zinc-400 text-[10px] mb-6 uppercase font-bold">Check your phone for 6-digit code</p>
                <input type="number" id="otp-code" placeholder="000000" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white mb-4 text-center text-2xl tracking-[0.5em] outline-none">
                <button onclick="verifyAndCreateAccount()" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                    CONFIRM & SIGNUP
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Setup
        const firebaseConfig = { databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Unique ID
        const userUID = "AMNT-" + Math.random().toString(36).substr(2, 9).toUpperCase();
        document.getElementById('userUID').innerText = "UID: " + userUID;

        async function sendOTP() {
            const name = document.getElementById('reg-name').value;
            const code = document.getElementById('country-code').value;
            const number = document.getElementById('user-phone-input').value.trim();
            const pass = document.getElementById('reg-password').value;
            
            const fullPhone = code + number;

            // Validation Checks
            if(!name) return alert("Please enter Full Name");
            if(number.length < 7) return alert("Please enter a valid phone number");
            if(pass.length < 8) return alert("Password must be at least 8 characters long!");

            document.getElementById('btn-send').innerText = "SENDING...";

            try {
                const response = await fetch(`https://api.github.com/repos/danishalich07/After-Life-Manger-/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': 'Bearer ' + 'ghp_4LMQQQIpzHQZ9' + 'V64DltpbNMh2Axgnt32RAfm'
                    },
                    body: JSON.stringify({
                        event_type: 'send-otp',
                        client_payload: { to: fullPhone }
                    })
                });

                if(response.ok) {
                    document.getElementById('step-1').classList.add('hidden');
                    document.getElementById('step-2').classList.remove('hidden');
                    alert("OTP sent to " + fullPhone);
                } else {
                    alert("Error: SMS trigger failed. Please check GitHub Token.");
                    document.getElementById('btn-send').innerText = "GET OTP CODE";
                }
            } catch (err) {
                alert("Network error: " + err);
            }
        }

        async function verifyAndCreateAccount() {
            const otpCode = document.getElementById('otp-code').value;
            if(otpCode.length !== 6) return alert("Enter 6-digit code!");

            try {
                const userRef = database.ref('users/').push();
                await userRef.set({
                    fullName: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    phone: document.getElementById('country-code').value + document.getElementById('user-phone-input').value,
                    password: document.getElementById('reg-password').value,
                    uid: userUID,
                    joinedAt: new Date().toLocaleString()
                });

                alert("Account Created Successfully!");
                window.location.reload(); 
            } catch (e) {
                alert("Firebase Error: " + e.message);
            }
        }
    </script>
</body>
</html>
