<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Legacy - Master Lock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 15, 15, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 28px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 450px; left: 50%; transform: translateX(-50%); background: #080808; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 20px 0; z-index: 1000; }
        .nav-item { color: #444; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #eab308; }
        .platform-chip { background: #111; border: 1px solid #333; border-radius: 14px; padding: 12px; font-size: 10px; font-weight: 800; color: #888; text-transform: uppercase; }
        .platform-chip:active { border-color: #eab308; color: #eab308; }
        .visit-link-btn { background: #eab308; color: #000; padding: 7px 14px; border-radius: 10px; font-size: 10px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        input, textarea { background: #0a0a0a !important; border: 1px solid #222 !important; color: #fff !important; border-radius: 16px; padding: 16px; width: 100%; margin-bottom: 12px; outline: none; }
        input:focus { border-color: #eab308 !important; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="max-w-md mx-auto px-6">
        
        <header class="py-10 flex justify-between items-center">
            <div>
                <p class="text-yellow-600 text-[9px] font-black uppercase tracking-[0.4em] mb-1">Legacy Master System</p>
                <h1 class="text-2xl font-black italic text-white tracking-tighter">DanishAlich07</h1>
            </div>
            <div class="h-12 w-12 glass-panel flex items-center justify-center border-yellow-600/20">
                <i class="fa-solid fa-link-slash text-yellow-500 text-lg"></i>
            </div>
        </header>

        <div id="view-vault">
            <div class="grid grid-cols-2 gap-4 mb-10">
                <button onclick="openPanel('exchanges')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-blue-600/40">
                    <i class="fa-solid fa-building-columns text-blue-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest">Exchanges</span>
                </button>
                <button onclick="openPanel('wallets')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-orange-600/40">
                    <i class="fa-solid fa-wallet text-orange-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest">Wallets</span>
                </button>
                <button onclick="openPanel('socials')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-pink-600/40">
                    <i class="fa-solid fa-hashtag text-pink-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest">Social Media</span>
                </button>
                <button onclick="openPanel('gaming')" class="glass-panel p-6 flex flex-col items-center gap-3 border-b-2 border-green-600/40">
                    <i class="fa-solid fa-gamepad text-green-500 text-2xl"></i><span class="text-[10px] font-black uppercase tracking-widest">Gaming</span>
                </button>
            </div>

            <div id="vault-list" class="space-y-4">
                <p class="text-[10px] font-bold text-zinc-700 uppercase tracking-widest border-b border-zinc-900 pb-2">Verified Legacy Assets</p>
            </div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="glass-panel p-10 text-center mb-6">
                <div class="w-20 h-20 bg-zinc-900 rounded-full mx-auto mb-4 border border-yellow-600/20 flex items-center justify-center">
                    <i class="fa-solid fa-fingerprint text-3xl text-yellow-600"></i>
                </div>
                <h2 id="user-mail" class="font-bold text-lg">...</h2>
                <span class="text-[9px] bg-green-900/20 text-green-500 px-3 py-1 rounded-full font-bold uppercase mt-3 inline-block">System Locked</span>
            </div>
        </div>

        <div id="action-sheet" class="hidden fixed inset-0 z-[2000] flex items-end">
            <div class="absolute inset-0 bg-black/95" onclick="closePanel()"></div>
            <div class="glass-panel w-full rounded-t-[40px] p-10 relative z-[2001] border-t border-yellow-600/30 max-h-[85vh] overflow-y-auto">
                <div class="w-12 h-1 bg-zinc-800 mx-auto mb-8 rounded-full"></div>
                <div id="tag-grid" class="grid grid-cols-3 gap-2 mb-8"></div>
                <div id="form-box" class="hidden animate-in fade-in duration-300">
                    <div id="dynamic-fields"></div>
                    <button onclick="saveAsset()" class="w-full bg-yellow-600 text-black font-black py-5 rounded-2xl uppercase tracking-tighter text-xs shadow-xl shadow-yellow-600/10">Lock Asset & Link</button>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <div onclick="switchTab('vault')" id="t-vault" class="nav-item active"><i class="fa-solid fa-shield-halved text-xl"></i><br><span class="text-[8px] font-black uppercase mt-1">Vault</span></div>
            <div onclick="switchTab('profile')" id="t-profile" class="nav-item"><i class="fa-solid fa-user-gear text-xl"></i><br><span class="text-[8px] font-black uppercase mt-1">Profile</span></div>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let activeCat = ""; let activeTag = "";

        // Master Link Map (Purana logic + Links)
        const globalRegistry = {
            exchanges: { tags: ['Binance', 'OKX', 'ByBit', 'KuCoin', 'Coinbase', 'Mexc'], link: 'https://accounts.binance.com/en/login' },
            wallets: { tags: ['MetaMask', 'TrustWallet', 'Phantom', 'SafePal', 'Ledger'], link: 'https://portfolio.metamask.io/' },
            socials: { tags: ['YouTube', 'TikTok', 'Instagram', 'Facebook', 'Twitter', 'Telegram'], link: 'https://studio.youtube.com/' },
            gaming: { tags: ['Steam', 'Epic Games', 'PUBG', 'FreeFire', 'PlayStation', 'Xbox'], link: 'https://store.steampowered.com/login/' }
        };

        function switchTab(t) {
            document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + t).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('t-' + t).classList.add('active');
        }

        function openPanel(cat) {
            activeCat = cat;
            document.getElementById('action-sheet').classList.remove('hidden');
            const grid = document.getElementById('tag-grid');
            grid.innerHTML = "";
            globalRegistry[cat].tags.forEach(t => {
                grid.innerHTML += `<button onclick="selectTag('${t}')" id="tag-${t}" class="platform-chip">${t}</button>`;
            });
            document.getElementById('form-box').classList.add('hidden');
        }

        function selectTag(t) {
            activeTag = t;
            document.querySelectorAll('.platform-chip').forEach(b => b.style.borderColor = "#333");
            document.getElementById('tag-'+t).style.borderColor = "#eab308";
            document.getElementById('form-box').classList.remove('hidden');
            const fields = document.getElementById('dynamic-fields');
            if(activeCat === 'wallets') {
                fields.innerHTML = `<input id="f1" placeholder="Wallet Name"><textarea id="f2" placeholder="Secret Seed Phrase" rows="3"></textarea>`;
            } else {
                fields.innerHTML = `<input id="f1" placeholder="Login ID / Email"><input id="f2" placeholder="Password / Key / Backup Code">`;
            }
        }

        function closePanel() { document.getElementById('action-sheet').classList.add('hidden'); }

        function saveAsset() {
            const v1 = document.getElementById('f1').value;
            const v2 = document.getElementById('f2').value;
            if(!v1 || !v2) return alert("Security Breach: Missing Data");
            
            // Hardcoded link fetch or search fallback
            const finalLink = globalRegistry[activeCat].link;

            database.ref('vaults/' + auth.currentUser.uid).push({
                tag: activeTag, cat: activeCat, user: v1, link: finalLink, date: new Date().toLocaleDateString()
            }).then(() => location.reload());
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('user-mail').innerText = user.email;
                fetchLockedList(user.uid);
            } else { window.location.href = "index.html"; }
        });

        function fetchLockedList(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('vault-list');
                snap.forEach(child => {
                    const data = child.val();
                    list.innerHTML += `
                        <div class="glass-panel p-5 flex justify-between items-center mb-3 border-l-4 border-yellow-600">
                            <div>
                                <p class="text-[8px] text-zinc-600 font-black uppercase mb-1">${data.cat}</p>
                                <h4 class="text-sm font-bold tracking-tight">${data.tag}</h4>
                            </div>
                            <a href="${data.link}" target="_blank" class="visit-link-btn">
                                OPEN <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
