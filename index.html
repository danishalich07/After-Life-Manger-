<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Legacy - Ultra Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; margin: 0; }
        .glass { background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .platform-chip { background: #111; border: 1px solid #222; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: bold; text-align: center; color: #a1a1aa; transition: 0.2s; }
        .platform-chip:active { border-color: #eab308; color: #eab308; background: #1a1a0a; }
        input, textarea { background: #111 !important; border: 1px solid #333 !important; color: #fff !important; border-radius: 12px; padding: 14px; width: 100%; outline: none; margin-bottom: 12px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.95); border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; }
        .nav-active { color: #eab308; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-32">
    <div class="max-w-md mx-auto px-6">
        
        <header class="py-8 flex justify-between items-center">
            <div>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest italic">Digital Inheritance</p>
                <h1 id="user-name" class="text-xl font-black italic">DanishAlich07</h1>
            </div>
            <div class="h-10 w-10 bg-yellow-600/10 border border-yellow-600/20 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-bolt-lightning text-yellow-500"></i>
            </div>
        </header>

        <div id="page-vault">
            <h3 class="text-[10px] font-bold text-zinc-600 uppercase mb-4 tracking-widest">Select Category to Secure</h3>
            <div class="grid grid-cols-2 gap-3 mb-8">
                <button onclick="openPanel('exchanges')" class="glass p-5 rounded-2xl flex flex-col items-center gap-2 border-l-2 border-blue-500">
                    <i class="fa-solid fa-chart-pie text-blue-500 text-xl"></i><span class="text-xs font-bold uppercase">Exchanges</span>
                </button>
                <button onclick="openPanel('wallets')" class="glass p-5 rounded-2xl flex flex-col items-center gap-2 border-l-2 border-orange-500">
                    <i class="fa-solid fa-wallet text-orange-500 text-xl"></i><span class="text-xs font-bold uppercase">Wallets</span>
                </button>
                <button onclick="openPanel('socials')" class="glass p-5 rounded-2xl flex flex-col items-center gap-2 border-l-2 border-pink-500">
                    <i class="fa-solid fa-hashtag text-pink-500 text-xl"></i><span class="text-xs font-bold uppercase">Socials</span>
                </button>
                <button onclick="openPanel('gaming')" class="glass p-5 rounded-2xl flex flex-col items-center gap-2 border-l-2 border-green-500">
                    <i class="fa-solid fa-gamepad text-green-500 text-xl"></i><span class="text-xs font-bold uppercase">Gaming</span>
                </button>
            </div>

            <div id="vaulted-list" class="space-y-3">
                <p class="text-[10px] font-bold text-zinc-700 uppercase px-1 italic">Active Secured Vaults</p>
            </div>
        </div>

        <div id="entry-modal" class="hidden fixed inset-0 z-[200] flex items-end">
            <div class="absolute inset-0 bg-black/90" onclick="closePanel()"></div>
            <div class="glass w-full rounded-t-[40px] p-8 max-h-[85vh] overflow-y-auto relative z-[201] border-t border-yellow-600/30">
                <div class="w-16 h-1 bg-zinc-800 mx-auto mb-6 rounded-full"></div>
                <h2 id="modal-title" class="text-lg font-bold mb-4 uppercase text-yellow-500">Select Platform</h2>
                
                <div id="platform-grid" class="grid grid-cols-3 gap-2 mb-8 text-white"></div>

                <div id="form-section" class="hidden animate-in fade-in duration-300">
                    <div id="dynamic-inputs"></div>
                    <button onclick="saveAsset()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase shadow-lg shadow-yellow-600/20">Seal in Vault</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-active flex flex-col items-center gap-1"><i class="fa-solid fa-shield-heart"></i><span class="text-[8px] font-bold uppercase">Vault</span></div>
            <div class="text-zinc-600 flex flex-col items-center gap-1" onclick="showProfile()"><i class="fa-solid fa-user-circle"></i><span class="text-[8px] font-bold uppercase">Profile</span></div>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let activeCat = "";
        let activeTag = "";

        // FULL LISTS ADDED HERE
        const megaMap = {
            exchanges: ['Binance', 'OKX', 'ByBit', 'KuCoin', 'Coinbase', 'Gate.io', 'Kraken', 'Bitget', 'Mexc', 'Huobi'],
            wallets: ['MetaMask', 'TrustWallet', 'Phantom', 'Ledger', 'SafePal', 'Exodus', 'Coin98', 'Argent', 'Atomic', 'Zengo'],
            socials: ['YouTube', 'Facebook', 'Instagram', 'TikTok', 'Twitter (X)', 'LinkedIn', 'Snapchat', 'Reddit', 'Discord', 'Telegram'],
            gaming: ['Steam', 'Epic Games', 'PUBG', 'FreeFire', 'PlayStation', 'Xbox', 'Nintendo', 'Battle.net', 'Ubisoft', 'Origin']
        };

        function openPanel(cat) {
            activeCat = cat;
            document.getElementById('entry-modal').classList.remove('hidden');
            const grid = document.getElementById('platform-grid');
            grid.innerHTML = "";
            megaMap[cat].forEach(p => {
                grid.innerHTML += `<button onclick="selectPlatform('${p}')" id="btn-${p}" class="platform-chip">${p}</button>`;
            });
            document.getElementById('form-section').classList.add('hidden');
        }

        function selectPlatform(p) {
            activeTag = p;
            document.querySelectorAll('.platform-chip').forEach(b => b.style.borderColor = "#222");
            document.getElementById('btn-'+p).style.borderColor = "#eab308";
            document.getElementById('form-section').classList.remove('hidden');
            
            const inputs = document.getElementById('dynamic-inputs');
            if(activeCat === 'wallets') {
                inputs.innerHTML = `<input id="v1" placeholder="Wallet Nickname"><textarea id="v2" placeholder="12/24 Seed Phrase Words" rows="3"></textarea>`;
            } else if(activeCat === 'exchanges' || activeCat === 'socials') {
                inputs.innerHTML = `<input id="v1" placeholder="Login Email / Phone"><input id="v2" placeholder="Password / Backup Codes">`;
            } else {
                inputs.innerHTML = `<input id="v1" placeholder="In-game ID / User"><input id="v2" placeholder="Account Password">`;
            }
        }

        function closePanel() { document.getElementById('entry-modal').classList.add('hidden'); }

        function saveAsset() {
            const val1 = document.getElementById('v1').value;
            const val2 = document.getElementById('v2').value;
            if(!val1 || !val2) return alert("Fill all security boxes!");
            
            database.ref('vaults/' + auth.currentUser.uid).push({
                tag: activeTag, cat: activeCat, user: val1, date: new Date().toLocaleDateString()
            }).then(() => { location.reload(); });
        }

        auth.onAuthStateChanged(user => { if(user) fetchList(user.uid); });

        function fetchList(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('vaulted-list');
                snap.forEach(child => {
                    const item = child.val();
                    list.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center mb-3 border-l-2 border-yellow-600">
                        <div><p class="text-[8px] text-zinc-500 uppercase font-black">${item.cat}</p><h4 class="text-sm font-bold uppercase">${item.tag}</h4></div>
                        <i class="fa-solid fa-lock text-zinc-800"></i>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
