<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANAT | Global Estate Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #d4d4d8; }
        .vault-card { background: linear-gradient(145deg, #0f0f0f, #18181b); border: 1px solid #27272a; border-radius: 2rem; }
        .hidden { display: none; }
        .tab-active { border-bottom: 2px solid #eab308; color: #eab308; }
        .input-style { background: #000; border: 1px solid #27272a; padding: 1rem; border-radius: 1rem; width: 100%; outline: none; }
        .input-style:focus { border-color: #eab308; }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-md mx-auto p-5 space-y-6">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-3xl font-black text-yellow-500 italic tracking-tighter">AMANAT</h1>
            <button id="logout-btn" onclick="logout()" class="hidden text-[10px] bg-zinc-800 px-3 py-1 rounded-lg uppercase font-bold">Logout</button>
        </header>

        <div id="auth-container" class="vault-card p-8 shadow-2xl">
            <div class="flex justify-around mb-8 border-b border-zinc-800">
                <button id="tab-login" onclick="switchAuthTab('login')" class="pb-2 text-sm font-bold uppercase tab-active">Login</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="pb-2 text-sm font-bold uppercase text-zinc-600">Signup</button>
            </div>

            <div id="signup-form" class="hidden space-y-4">
                <input type="text" id="reg-name" placeholder="Full Legal Name" class="input-style">
                
                <div class="flex gap-2 p-1 bg-black rounded-xl border border-zinc-800 text-[10px] font-bold uppercase">
                    <button onclick="toggleRegMethod('gmail')" id="m-gmail" class="flex-1 py-2 rounded-lg bg-zinc-800 text-yellow-500">Gmail</button>
                    <button onclick="toggleRegMethod('phone')" id="m-phone" class="flex-1 py-2 rounded-lg">Phone Number</button>
                </div>

                <div id="gmail-field">
                    <input type="email" id="reg-email" placeholder="Gmail Address" class="input-style">
                </div>
                
                <div id="phone-field" class="hidden flex gap-2">
                    <select id="country-code" class="w-1/3 input-style text-[10px]"></select>
                    <input type="tel" id="reg-phone" placeholder="Phone Number" class="w-2/3 input-style">
                </div>

                <input type="password" id="reg-pass" placeholder="Create Master Key (8+ Chars)" class="input-style">
                <button onclick="handleSignup()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">Initialize Protocol</button>
            </div>

            <div id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email Address" class="input-style">
                <input type="password" id="login-pass" placeholder="Master Password" class="input-style">
                <button onclick="handleLogin()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">Access Vault</button>
            </div>
        </div>

        <div id="verify-msg" class="hidden vault-card p-8 text-center space-y-4">
            <i class="fa-solid fa-envelope-circle-check text-5xl text-yellow-500 animate-pulse"></i>
            <h3 class="text-xl font-bold text-white uppercase">Verify Identity</h3>
            <p class="text-sm text-zinc-400">Humnay aapki Gmail par verification link bheja hai. Activation ke liye us par click karein.</p>
            <button onclick="location.reload()" class="text-yellow-500 font-bold uppercase text-xs underline">Back to Login</button>
        </div>

        <div id="digital-safe" class="hidden space-y-6">
            <div class="vault-card p-6 border-l-4 border-l-yellow-600">
                <h3 class="text-sm font-black uppercase mb-4 text-yellow-500">Asset Vault</h3>
                <textarea id="secret-data" rows="5" placeholder="Private keys, Seed phrases, or Master Passwords..." class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-xs mb-4 text-yellow-500 font-mono"></textarea>
                <button onclick="encryptAndSave()" class="w-full bg-yellow-600 text-black font-black py-3 rounded-xl text-[10px] uppercase tracking-widest">Encrypt & Secure</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com",
            projectId: "amant-manger",
            authDomain: "amant-manger.firebaseapp.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentMethod = 'gmail';

        // Load Global Country Codes
        async function loadCountries() {
            const select = document.getElementById('country-code');
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=idd,flag');
                const data = await response.json();
                let options = '<option value="">Code</option>';
                data.forEach(c => {
                    if (c.idd.root) {
                        const code = c.idd.root + (c.idd.suffixes ? c.idd.suffixes[0] : "");
                        options += `<option value="${code}">${c.flag} ${code}</option>`;
                    }
                });
                select.innerHTML = options;
            } catch (e) { select.innerHTML = '<option value="+92">🇵🇰 +92</option>'; }
        }
        loadCountries();

        function switchAuthTab(tab) {
            document.getElementById('login-form').classList.toggle('hidden', tab === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', tab === 'login');
            document.getElementById('tab-login').classList.toggle('tab-active', tab === 'login');
            document.getElementById('tab-signup').classList.toggle('tab-active', tab === 'signup');
        }

        function toggleRegMethod(method) {
            currentMethod = method;
            document.getElementById('gmail-field').classList.toggle('hidden', method === 'phone');
            document.getElementById('phone-field').classList.toggle('hidden', method === 'gmail');
            document.getElementById('m-gmail').classList.toggle('bg-zinc-800', method === 'gmail');
            document.getElementById('m-gmail').classList.toggle('text-yellow-500', method === 'gmail');
            document.getElementById('m-phone').classList.toggle('bg-zinc-800', method === 'phone');
            document.getElementById('m-phone').classList.toggle('text-yellow-500', method === 'phone');
        }

        async function handleSignup() {
            const email = (currentMethod === 'gmail') ? document.getElementById('reg-email').value : document.getElementById('reg-phone').value + "@amanat.protocol";
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;

            if(pass.length < 8) return alert("Security Error: Master Key must be 8+ characters!");

            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, pass);
                await userCred.user.sendEmailVerification();
                await database.ref('users/' + userCred.user.uid).set({ 
                    fullName: name, 
                    identifier: email, 
                    type: currentMethod,
                    regDate: new Date().getTime() 
                });
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('verify-msg').classList.remove('hidden');
            } catch (e) { alert("Registration Error: " + e.message); }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                const userCred = await auth.signInWithEmailAndPassword(email, pass);
                if(!userCred.user.emailVerified) {
                    auth.signOut();
                    return alert("Identity Pending: Pehle Gmail par aaya link verify karein!");
                }
            } catch (e) { alert("Access Denied: " + e.message); }
        }

        auth.onAuthStateChanged((user) => {
            if (user && user.emailVerified) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('digital-safe').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
            }
        });

        function logout() { auth.signOut(); location.reload(); }

        function encryptAndSave() {
            const data = document.getElementById('secret-data').value;
            const user = auth.currentUser;
            if(!data) return alert("Safe cannot be locked empty!");
            const encrypted = CryptoJS.AES.encrypt(data, "MASTER_ENCRYPTION_KEY").toString();
            database.ref('vaults/' + user.uid).push({ payload: encrypted, timestamp: new Date().getTime() });
            alert("ASSET SECURED: Your data is now encrypted in the cloud.");
            document.getElementById('secret-data').value = "";
        }
    </script>
</body>
</html>
