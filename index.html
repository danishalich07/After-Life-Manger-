<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amant OS | Fixed Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .app-card { background: #111; border-radius: 20px; border: 1px solid #222; padding: 20px; transition: 0.2s; }
        .app-card:active { transform: scale(0.95); border-color: #EAB308; }
        input { background: #0a0a0a !important; border: 1px solid #222 !important; color: white !important; border-radius: 12px; padding: 15px; width: 100%; margin-bottom: 10px; outline: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="h-screen flex flex-col justify-center px-10">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold italic tracking-tighter">AMANT <span class="text-yellow-500">OS</span></h1>
            <p class="text-zinc-600 text-[10px] uppercase mt-2 font-bold">Encrypted Control Center</p>
        </div>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Master Password">
        <button onclick="authAction()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-xl uppercase text-xs mt-4">Unlock Vault</button>
    </div>

    <div id="main-app" class="hidden">
        <header class="p-8 flex justify-between items-center border-b border-zinc-900">
            <h2 class="text-xl font-black italic">Legacy Vault</h2>
            <button onclick="auth.signOut()" class="text-zinc-600"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <div class="p-6">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div onclick="addPlatform('Binance', 'https://accounts.binance.com/')" class="app-card text-center">
                    <i class="fa-solid fa-chart-line text-yellow-500 text-2xl mb-2"></i>
                    <p class="text-[10px] font-bold">BINANCE</p>
                </div>
                <div onclick="addPlatform('Web3', 'https://portfolio.metamask.io/')" class="app-card text-center">
                    <i class="fa-solid fa-wallet text-orange-500 text-2xl mb-2"></i>
                    <p class="text-[10px] font-bold">WEB3</p>
                </div>
            </div>

            <h3 class="text-[10px] text-zinc-700 font-black uppercase mb-4 tracking-widest">Your Protected Links</h3>
            <div id="vault-list" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0", authDomain: "amant-manger.firebaseapp.com", projectId: "amant-manger", databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        function authAction() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e,p));
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                loadAssets(user.uid);
            }
        });

        function addPlatform(tag, link) {
            const user = prompt("Enter Account ID/Email:");
            if(user) {
                db.ref('vaults/' + auth.currentUser.uid).push({ tag, link, user });
            }
        }

        function loadAssets(uid) {
            db.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('vault-list');
                list.innerHTML = "";
                snap.forEach(child => {
                    const data = child.val();
                    list.innerHTML += `
                    <div onclick="window.open('${data.link}', '_blank')" class="app-card flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold">${data.tag}</p>
                            <p class="text-[10px] text-zinc-500">${data.user}</p>
                        </div>
                        <i class="fa-solid fa-external-link text-zinc-700 text-xs"></i>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
