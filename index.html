<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Legacy - Unified Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #050505; color: #fff; }
        .glass-card { background: #0f0f0f; border: 1px solid #222; border-radius: 24px; padding: 24px; }
        .platform-btn { background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 16px; font-size: 11px; text-transform: uppercase; font-weight: bold; color: #a1a1aa; transition: 0.3s; }
        .platform-btn:active, .btn-active { border-color: #eab308; color: #eab308; background: #2a2a10; }
        .input-group label { display: block; font-size: 10px; color: #71717a; text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
        input, textarea { background: #000 !important; border: 1px solid #333 !important; color: #fff !important; padding: 14px; border-radius: 12px; width: 100%; outline: none; margin-bottom: 16px; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20">
    <div class="max-w-md mx-auto p-5">
        <header class="py-8">
            <h1 class="text-2xl font-black text-yellow-500 italic uppercase">Digital Inheritance</h1>
            <p class="text-[10px] text-zinc-500 tracking-[0.3em] uppercase">Unified Asset Protection</p>
        </header>

        <div class="glass-card mb-6">
            <div id="step-1">
                <h3 class="text-[10px] font-bold text-zinc-500 uppercase mb-4 tracking-widest">1. Select Category</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="showPlatforms('exchanges')" class="platform-btn"><i class="fa-solid fa-building-columns mb-2 block text-lg"></i>Exchanges</button>
                    <button onclick="showPlatforms('wallets')" class="platform-btn"><i class="fa-solid fa-wallet mb-2 block text-lg"></i>Web3 Wallets</button>
                    <button onclick="showPlatforms('social')" class="platform-btn"><i class="fa-solid fa-share-nodes mb-2 block text-lg"></i>Social Media</button>
                    <button onclick="showPlatforms('gaming')" class="platform-btn"><i class="fa-solid fa-gamepad mb-2 block text-lg"></i>Gaming</button>
                    <button onclick="showPlatforms('income')" class="platform-btn col-span-2"><i class="fa-solid fa-money-bill-trend-up mb-2 block text-lg"></i>Income Sites</button>
                </div>
            </div>

            <div id="step-2" class="hidden mt-8">
                <h3 class="text-[10px] font-bold text-zinc-500 uppercase mb-4 tracking-widest">2. Tag Platform</h3>
                <div id="platform-list" class="grid grid-cols-3 gap-2"></div>
            </div>

            <div id="step-3" class="hidden mt-8 border-t border-zinc-900 pt-6">
                <div id="dynamic-fields"></div>
                <button onclick="processAndSave()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl uppercase tracking-tighter">Secure Asset</button>
            </div>
        </div>

        <div id="vault-display" class="space-y-3"></div>
    </div>

    <script>
        // Firebase Configuration (Aapki purani keys)
        const firebaseConfig = {
            apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0",
            authDomain: "amant-manger.firebaseapp.com",
            projectId: "amant-manger",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentCat = "";
        let currentApp = "";

        const platformMap = {
            exchanges: ['Binance', 'OKX', 'ByBit', 'KuCoin', 'Coinbase'],
            wallets: ['MetaMask', 'TrustWallet', 'Phantom', 'Ledger', 'SafePal'],
            social: ['YouTube', 'TikTok', 'Instagram', 'Facebook', 'X'],
            gaming: ['Steam', 'Epic Games', 'PUBG ID', 'PlayStation', 'Xbox'],
            income: ['Upwork', 'Fiverr', 'Google AdSense', 'Amazon', 'PayPal']
        };

        function showPlatforms(cat) {
            currentCat = cat;
            document.getElementById('step-2').classList.remove('hidden');
            const list = document.getElementById('platform-list');
            list.innerHTML = "";
            platformMap[cat].forEach(app => {
                list.innerHTML += `<button onclick="selectApp('${app}')" class="platform-btn border-zinc-800">${app}</button>`;
            });
        }

        function selectApp(app) {
            currentApp = app;
            document.getElementById('step-3').classList.remove('hidden');
            renderFields();
        }

        function renderFields() {
            const container = document.getElementById('dynamic-fields');
            let html = "";
            if(currentCat === 'exchanges') {
                html = `<div class="input-group"><label>Login Email</label><input type="text" id="f1"></div>
                        <div class="input-group"><label>Password</label><input type="password" id="f2"></div>
                        <div class="input-group"><label>Phone/2FA</label><input type="text" id="f3"></div>`;
            } else if(currentCat === 'wallets') {
                html = `<div class="input-group"><label>Wallet Name</label><input type="text" id="f1"></div>
                        <div class="input-group"><label>Seed Phrase</label><textarea id="f2" rows="3"></textarea></div>
                        <div class="input-group"><label>Password</label><input type="password" id="f3"></div>`;
            } else if(currentCat === 'gaming') {
                html = `<div class="input-group"><label>ID / Username</label><input type="text" id="f1"></div>
                        <div class="input-group"><label>Password</label><input type="password" id="f2"></div>
                        <div class="input-group"><label>Recovery Codes</label><textarea id="f3" rows="2"></textarea></div>`;
            } else {
                html = `<div class="input-group"><label>Primary Login</label><input type="text" id="f1"></div>
                        <div class="input-group"><label>Secret Key/Pass</label><input type="password" id="f2"></div>
                        <div class="input-group"><label>Extra Details</label><textarea id="f3" rows="2"></textarea></div>`;
            }
            container.innerHTML = html;
        }

        function processAndSave() {
            const data = { f1: document.getElementById('f1').value, f2: document.getElementById('f2').value, f3: document.getElementById('f3').value };
            const encrypted = CryptoJS.AES.encrypt(JSON.stringify(data), "SECURE_KEY_2026").toString();
            database.ref('vaults/' + auth.currentUser.uid).push({
                app: currentApp, category: currentCat, payload: encrypted, date: new Date().toLocaleDateString()
            }).then(() => { location.reload(); });
        }

        auth.onAuthStateChanged(user => { if(user) fetchVault(user.uid); else window.location.href = "index.html"; });

        function fetchVault(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const display = document.getElementById('vault-display');
                display.innerHTML = '<h3 class="text-[10px] font-bold text-zinc-600 uppercase mb-4">Secured Assets</h3>';
                snap.forEach(child => {
                    const item = child.val();
                    display.innerHTML += `
                        <div class="glass-card p-4 flex items-center justify-between border-l-4 border-yellow-600 mb-3">
                            <div><h4 class="text-xs font-black uppercase">${item.app}</h4><p class="text-[8px] text-zinc-500 font-bold uppercase">${item.category}</p></div>
                            <button onclick="deleteAsset('${child.key}')"><i class="fa-solid fa-trash-can text-zinc-800 text-xs"></i></button>
                        </div>`;
                });
            });
        }
        function deleteAsset(key) { if(confirm("Delete?")) database.ref('vaults/' + auth.currentUser.uid + '/' + key).remove(); }
    </script>
</body>
</html>
