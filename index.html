<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANAT | Digital Estate Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; }
        .vault-card { background: linear-gradient(145deg, #121212, #1a1a1a); border: 1px solid #2d2d2d; }
        .glow-gold { box-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
        .hidden { display: none; }
    </style>
</head>
<body class="text-gray-300 pb-20">

    <div class="max-w-md mx-auto p-5">
        <header class="flex justify-between items-end py-8">
            <div>
                <h1 class="text-4xl font-black text-yellow-500 tracking-tighter italic">AMANAT</h1>
                <p class="text-[10px] text-zinc-500 uppercase tracking-[0.3em]">Institutional Grade Security</p>
            </div>
            <div class="text-right pb-1">
                <div id="status-dot" class="inline-block w-2 h-2 bg-green-500 rounded-full animate-pulse mr-1"></div>
                <span class="text-[10px] font-bold text-zinc-400 uppercase">Vault Active</span>
            </div>
        </header>

        <div id="auth-section" class="vault-card rounded-[2rem] p-8 shadow-2xl">
            <div id="reg-form">
                <h2 class="text-xl font-bold text-white mb-6 uppercase">Initialize Protocol</h2>
                <div class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Legal Full Name" class="w-full bg-zinc-950 border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-yellow-600 transition-all">
                    <div class="flex gap-2">
                        <select id="country-code" class="w-1/3 bg-zinc-950 border border-zinc-800 p-4 rounded-xl text-[10px] text-white outline-none"></select>
                        <input type="tel" id="user-phone" placeholder="Phone Number" class="w-2/3 bg-zinc-950 border border-zinc-800 p-4 rounded-xl text-white outline-none">
                    </div>
                    <input type="password" id="reg-pass" placeholder="Master Vault Key (8+ Chars)" class="w-full bg-zinc-950 border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-yellow-600">
                    <button onclick="sendOTP()" id="btn-otp" class="w-full bg-yellow-600 text-black font-black py-4 rounded-xl uppercase tracking-widest hover:bg-yellow-500 transition-all">Begin Verification</button>
                </div>
            </div>

            <div id="otp-form" class="hidden text-center">
                <p class="text-yellow-500 text-xs mb-4 uppercase font-bold">Encrypted Code Sent</p>
                <input type="number" id="otp-code" placeholder="000000" class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-white text-center text-3xl tracking-widest outline-none mb-4">
                <button onclick="verifyAndEnter()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase tracking-widest">Open Vault</button>
            </div>
        </div>

        <div id="vault-dashboard" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="vault-card p-5 rounded-[1.5rem] text-center" onclick="alert('Bitcoin Vault Locked')">
                    <i class="fa-brands fa-bitcoin text-3xl text-orange-500 mb-2"></i>
                    <p class="text-[10px] font-bold uppercase">Crypto Assets</p>
                </div>
                <div class="vault-card p-5 rounded-[1.5rem] text-center" onclick="alert('Digital Rights Locked')">
                    <i class="fa-solid fa-file-contract text-3xl text-blue-500 mb-2"></i>
                    <p class="text-[10px] font-bold uppercase">Legal Documents</p>
                </div>
            </div>

            <div class="vault-card p-6 rounded-[2rem] border-l-4 border-l-yellow-600">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-sm font-black uppercase italic">The Guardian Timer</h3>
                    <i class="fa-solid fa-clock-rotate-left text-yellow-600"></i>
                </div>
                <p class="text-[9px] text-zinc-500 mb-4">Inactivity period before ownership transfer protocol begins.</p>
                <select id="dms-timer" class="w-full bg-black p-3 rounded-lg text-xs border border-zinc-800 outline-none mb-4">
                    <option value="90">90 Days (Recommended)</option>
                    <option value="180">180 Days</option>
                    <option value="365">1 Year (Maximum)</option>
                </select>
                <div class="bg-yellow-600/10 p-3 rounded-lg border border-yellow-600/20">
                    <p class="text-[10px] text-yellow-500 leading-tight">System will alert your family if you don't check-in for 90 days.</p>
                </div>
            </div>

            <div class="vault-card p-6 rounded-[2rem]">
                <h3 class="text-sm font-black uppercase mb-4 text-white">Designated Heirs</h3>
                <div class="space-y-3">
                    <div class="flex items-center gap-3 bg-black/50 p-3 rounded-xl border border-zinc-800">
                        <i class="fa-solid fa-user-shield text-zinc-500"></i>
                        <input type="text" id="heir-1" placeholder="Primary Beneficiary Name" class="bg-transparent text-[11px] outline-none w-full">
                    </div>
                    <div class="flex items-center gap-3 bg-black/50 p-3 rounded-xl border border-zinc-800">
                        <i class="fa-solid fa-user-shield text-zinc-500"></i>
                        <input type="text" id="heir-2" placeholder="Secondary Beneficiary Name" class="bg-transparent text-[11px] outline-none w-full">
                    </div>
                </div>
                <button class="w-full mt-4 bg-zinc-800 py-3 rounded-xl text-[10px] font-bold uppercase hover:bg-zinc-700">Lock Inheritance Plan</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase & ID Logic
        const firebaseConfig = { databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const userUID = "AMNT-PRTCL-" + Math.random().toString(36).substr(2, 6).toUpperCase();
        document.getElementById('userUID').innerText = "UID: " + userUID;

        // Load Countries
        async function loadCountries() {
            const select = document.getElementById('country-code');
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,idd,flag');
                const countries = await response.json();
                countries.sort((a, b) => a.name.common.localeCompare(b.name.common));
                let options = '<option value="">Code</option>';
                countries.forEach(c => {
                    if (c.idd.root) {
                        const code = c.idd.root + (c.idd.suffixes ? c.idd.suffixes[0] : "");
                        options += `<option value="${code}">${c.flag} ${code}</option>`;
                    }
                });
                select.innerHTML = options;
            } catch (err) { select.innerHTML = '<option value="+92">🇵🇰 +92</option>'; }
        }
        loadCountries();

        // OTP & Auth Logic
        async function sendOTP() {
            const name = document.getElementById('reg-name').value;
            const pass = document.getElementById('reg-pass').value;
            const phone = document.getElementById('country-code').value + document.getElementById('user-phone').value;

            if(!name || pass.length < 8) return alert("Verify details and 8+ char password!");
            
            document.getElementById('btn-otp').innerText = "SECURING CONNECTION...";
            
            const response = await fetch(`https://api.github.com/repos/danishalich07/After-Life-Manger-/dispatches`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': 'Bearer ' + 'ghp_4LMQQQIpzHQZ9' + 'V64DltpbNMh2Axgnt32RAfm'
                },
                body: JSON.stringify({
                    event_type: 'send-otp',
                    client_payload: { to: phone }
                })
            });

            if(response.ok) {
                document.getElementById('reg-form').classList.add('hidden');
                document.getElementById('otp-form').classList.remove('hidden');
            } else { alert("Gateway Error. Verify GitHub Token."); }
        }

        async function verifyAndEnter() {
            const otp = document.getElementById('otp-code').value;
            if(otp.length !== 6) return alert("Invalid Code");

            // Save Initial State to Firebase
            const userRef = database.ref('vaults/').push();
            await userRef.set({
                name: document.getElementById('reg-name').value,
                phone: document.getElementById('user-phone').value,
                uid: userUID,
                protocol_status: "LOCKED",
                last_checkin: new Date().getTime()
            });

            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('vault-dashboard').classList.remove('hidden');
            alert("Digital Will Protocol Activated.");
        }
    </script>
</body>
</html>
