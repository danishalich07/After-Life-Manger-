<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amant Assets Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #e4e4e7; }
        .vault-card { background: linear-gradient(145deg, #0f0f0f, #18181b); border: 1px solid #27272a; border-radius: 1.5rem; }
        .nav-active { color: #eab308; border-top: 2px solid #eab308; }
        .input-style { background: #000; border: 1px solid #27272a; padding: 0.8rem; border-radius: 0.8rem; width: 100%; color: white; outline: none; font-size: 14px; }
        .platform-icon { font-size: 20px; margin-bottom: 5px; }
    </style>
</head>
<body class="pb-28">
    <div class="max-w-md mx-auto p-5">
        
        <header class="flex justify-between items-center py-6 border-b border-zinc-900 mb-6">
            <div>
                <h1 id="page-title" class="text-xl font-black text-yellow-500 uppercase italic">Digital Assets</h1>
                <p class="text-[8px] text-zinc-500 tracking-widest uppercase">Legacy Protection System</p>
            </div>
            <span id="user-display" class="text-[10px] bg-zinc-900 px-3 py-1 rounded-full border border-zinc-800 text-yellow-600 font-bold">...</span>
        </header>

        <div id="section-vault" class="space-y-6">
            <div class="vault-card p-6 shadow-2xl">
                <h3 class="text-xs font-bold text-zinc-400 mb-4 uppercase tracking-tighter">Secure New Income Asset</h3>
                
                <label class="text-[10px] text-zinc-500 uppercase ml-1">Select Platform Type</label>
                <select id="asset-type" class="input-style mb-3">
                    <option value="Crypto">Crypto (Wallets, Binance, Seed Phrases)</option>
                    <option value="Social Media">Social Media (YT, TikTok, FB, Insta, X)</option>
                    <option value="E-Commerce">Freelance (Upwork, Fiverr, AdSense)</option>
                    <option value="Gaming">Gaming (Steam, skins, IDs)</option>
                    <option value="System">Main IDs (Gmail, Apple ID)</option>
                </select>

                <input type="text" id="asset-name" placeholder="Specific Name (e.g. YouTube Channel 01)" class="input-style mb-3">
                <textarea id="secret-data" rows="3" placeholder="Paste Login Credentials, Secret Keys or Backup Codes..." class="input-style mb-4 font-mono"></textarea>
                
                <button onclick="encryptAndSave()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-xl uppercase hover:bg-yellow-500 active:scale-95 transition-all">
                    Secure for Heir
                </button>
            </div>

            <div class="space-y-4">
                <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Your Secured Legacy</h3>
                <div id="assets-list" class="space-y-3"></div>
            </div>
        </div>

        <div id="section-heir" class="hidden space-y-4">
            <div class="vault-card p-6">
                <h3 class="text-xs font-bold text-blue-500 uppercase mb-4">Heir Management</h3>
                <input type="text" id="heir-name" placeholder="Heir Full Name" class="input-style mb-3">
                <input type="email" id="heir-email" placeholder="Heir Gmail (For Recovery)" class="input-style mb-4">
                <button onclick="saveHeir()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl uppercase">Update Heir Info</button>
            </div>
        </div>

        <div id="section-profile" class="hidden space-y-4">
            <div class="vault-card p-6">
                <h3 class="text-xs font-bold text-yellow-500 uppercase mb-4">Security Settings</h3>
                <input type="password" id="new-pass" placeholder="New Password" class="input-style mb-4">
                <button onclick="updatePassword()" class="w-full bg-zinc-800 text-white font-bold py-3 rounded-xl uppercase">Change Password</button>
            </div>
            <button onclick="logout()" class="w-full bg-red-900/20 border border-red-900 text-red-500 font-bold py-4 rounded-xl uppercase">Logout System</button>
        </div>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-zinc-800 flex justify-around max-w-md mx-auto z-50">
        <button onclick="showSection('vault')" id="nav-vault" class="p-4 flex flex-col items-center gap-1 nav-active">
            <i class="fa-solid fa-vault"></i><span class="text-[8px] uppercase font-bold tracking-widest">Vault</span>
        </button>
        <button onclick="showSection('heir')" id="nav-heir" class="p-4 flex flex-col items-center gap-1 text-zinc-600">
            <i class="fa-solid fa-users-viewfinder"></i><span class="text-[8px] uppercase font-bold tracking-widest">Heir</span>
        </button>
        <button onclick="showSection('profile')" id="nav-profile" class="p-4 flex flex-col items-center gap-1 text-zinc-600">
            <i class="fa-solid fa-user-gear"></i><span class="text-[8px] uppercase font-bold tracking-widest">Profile</span>
        </button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0",
            authDomain: "amant-manger.firebaseapp.com",
            projectId: "amant-manger",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        function showSection(name) {
            document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + name).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-zinc-600'));
            document.getElementById('nav-' + name).classList.add('nav-active');
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('user-display').innerText = user.email.split('@')[0].toUpperCase();
                fetchAssets(user.uid);
                loadHeir(user.uid);
            } else { window.location.href = "index.html"; }
        });

        function encryptAndSave() {
            const type = document.getElementById('asset-type').value;
            const name = document.getElementById('asset-name').value;
            const data = document.getElementById('secret-data').value;
            if(!name || !data) return alert("Fill all fields");

            const encrypted = CryptoJS.AES.encrypt(data, "VAULT_SECRET_2026").toString();
            database.ref('vaults/' + auth.currentUser.uid).push({
                type, name, payload: encrypted, date: new Date().toLocaleDateString()
            }).then(() => {
                alert("Income Asset Secured!");
                document.getElementById('asset-name').value = "";
                document.getElementById('secret-data').value = "";
            });
        }

        function fetchAssets(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const list = document.getElementById('assets-list');
                list.innerHTML = "";
                snap.forEach(child => {
                    const item = child.val();
                    let icon = item.type === "Crypto" ? "fa-bitcoin-sign text-orange-500" : 
                               item.type === "Social Media" ? "fa-share-nodes text-pink-500" : 
                               item.type === "E-Commerce" ? "fa-money-bill-trend-up text-green-500" : "fa-shield text-blue-500";

                    list.innerHTML = `
                        <div class="vault-card p-4 flex justify-between items-center border-l-4 border-l-yellow-600">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid ${icon} text-lg"></i>
                                <div>
                                    <h4 class="text-xs font-black uppercase text-white">${item.name}</h4>
                                    <p class="text-[8px] text-zinc-500 font-bold">${item.type} | ${item.date}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="deleteItem('${child.key}')" class="text-zinc-800 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    ` + list.innerHTML;
                });
            });
        }

        function saveHeir() {
            const name = document.getElementById('heir-name').value;
            const email = document.getElementById('heir-email').value;
            database.ref('heirs/' + auth.currentUser.uid).set({ name, email }).then(() => alert("Heir Protocol Updated"));
        }

        function loadHeir(uid) {
            database.ref('heirs/' + uid).once('value', s => {
                if(s.val()) {
                    document.getElementById('heir-name').value = s.val().name;
                    document.getElementById('heir-email').value = s.val().email;
                }
            });
        }

        function deleteItem(key) { if(confirm("Confirm deletion?")) database.ref('vaults/' + auth.currentUser.uid + '/' + key).remove(); }
        function logout() { auth.signOut(); }
    </script>
</body>
</html>
