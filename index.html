<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANAT | Global Secure Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hidden { display: none; }
        select option { background: #18181b; color: white; }
        /* Custom scrollbar for country list */
        select::-webkit-scrollbar { width: 5px; }
        select::-webkit-scrollbar-thumb { background: #eab308; borderRadius: 10px; }
    </style>
</head>
<body class="bg-black text-gray-200 font-sans pb-24">

    <div class="max-w-md mx-auto p-4 space-y-6">
        <header class="flex justify-between items-center py-6 bg-zinc-950/50 sticky top-0 z-50 backdrop-blur-md px-2">
            <div>
                <h1 class="text-3xl font-black text-yellow-500 italic uppercase">AMANAT</h1>
                <p id="userUID" class="text-[9px] text-gray-500 font-mono italic">UID: LOADING...</p>
            </div>
            <div class="text-right">
                <p class="text-[8px] text-gray-500 uppercase tracking-widest">Global Network</p>
                <span class="text-[10px] text-green-500 font-bold tracking-tighter">● LIVE & SECURE</span>
            </div>
        </header>
        
        <div id="auth-container" class="bg-zinc-900 rounded-[2.5rem] border border-zinc-800 shadow-2xl p-6">
            <div id="step-1">
                <h2 class="text-2xl font-black text-yellow-500 italic mb-2 leading-tight">GLOBAL REGISTRATION</h2>
                <p class="text-zinc-400 text-[10px] mb-6 uppercase font-bold tracking-widest">Available in 200+ Countries</p>
                
                <div class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Full Name" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600 transition-all">
                    
                    <input type="email" id="reg-email" placeholder="Email Address" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600 transition-all">
                    
                    <div class="flex gap-2">
                        <select id="country-code" class="w-2/5 bg-black border border-zinc-800 p-4 rounded-2xl text-white text-[11px] outline-none focus:border-yellow-600">
                            <option value="">Loading...</option>
                        </select>
                        <input type="tel" id="user-phone-input" placeholder="Phone Number" class="w-3/5 bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600 transition-all">
                    </div>

                    <div class="relative">
                        <input type="password" id="reg-password" placeholder="Create Password (8+ Characters)" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white outline-none focus:border-yellow-600 transition-all">
                        <p id="pass-hint" class="text-[8px] text-zinc-500 mt-1 ml-2 italic">Minimum 8 characters required for security.</p>
                    </div>
                    
                    <button onclick="sendOTP()" id="btn-send" class="w-full bg-yellow-600 text-black font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest">
                        GET INTERNATIONAL OTP
                    </button>
                </div>
            </div>

            <div id="step-2" class="hidden text-center">
                <h2 class="text-2xl font-black text-green-500 italic mb-2">VERIFICATION</h2>
                <p class="text-zinc-400 text-[10px] mb-6 uppercase font-bold">Code sent to your worldwide number</p>
                <input type="number" id="otp-code" placeholder="000000" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-white mb-4 text-center text-3xl tracking-[0.3em] outline-none font-bold">
                <button onclick="verifyAndCreateAccount()" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest">
                    ACTIVATE ACCOUNT
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Setup
        const firebaseConfig = { databaseURL: "https://amant-manger-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Unique ID Generation
        const userUID = "AMNT-" + Math.random().toString(36).substr(2, 9).toUpperCase();
        document.getElementById('userUID').innerText = "UID: " + userUID;

        // Fetch all countries from API
        async function loadCountries() {
            const select = document.getElementById('country-code');
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,idd,flag');
                const countries = await response.json();
                
                // Sort countries alphabetically
                countries.sort((a, b) => a.name.common.localeCompare(b.name.common));

                let options = '<option value="">Select Country</option>';
                countries.forEach(c => {
                    if (c.idd.root) {
                        const code = c.idd.root + (c.idd.suffixes ? c.idd.suffixes[0] : "");
                        options += `<option value="${code}">${c.flag} ${c.name.common} (${code})</option>`;
                    }
                });
                select.innerHTML = options;
            } catch (err) {
                select.innerHTML = '<option value="+92">🇵🇰 Pakistan (+92)</option>';
                console.error("Country load failed", err);
            }
        }
        loadCountries();

        async function sendOTP() {
            const name = document.getElementById('reg-name').value;
            const countryCode = document.getElementById('country-code').value;
            const number = document.getElementById('user-phone-input').value.trim();
            const pass = document.getElementById('reg-password').value;
            const fullPhone = countryCode + number;

            if(!name || !countryCode || !number) return alert("Please fill all details correctly.");
            if(pass.length < 8) return alert("Security Alert: Password must be at least 8 characters!");

            document.getElementById('btn-send').innerText = "CONNECTING GLOBAL SERVER...";

            try {
                const response = await fetch(`https://api.github.com/repos/danishalich07/After-Life-Manger-/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': 'Bearer ' + 'ghp_4LMQQQIpzHQZ9' + 'V64DltpbNMh2Axgnt32RAfm'
                    },
                    body: JSON.stringify({
                        event_type: 'send-otp',
                        client_payload: { to: fullPhone }
                    })
                });

                if(response.ok) {
                    document.getElementById('step-1').classList.add('hidden');
                    document.getElementById('step-2').classList.remove('hidden');
                    alert("OTP Dispatched to " + fullPhone);
                } else {
                    alert("GitHub Action Trigger Failed. Check Token.");
                    document.getElementById('btn-send').innerText = "GET INTERNATIONAL OTP";
                }
            } catch (err) {
                alert("Network failure: " + err);
            }
        }

        async function verifyAndCreateAccount() {
            const otp = document.getElementById('otp-code').value;
            if(otp.length !== 6) return alert("Enter valid 6-digit code!");

            try {
                const userRef = database.ref('users/').push();
                await userRef.set({
                    fullName: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    phone: document.getElementById('country-code').value + document.getElementById('user-phone-input').value,
                    password: document.getElementById('reg-password').value,
                    uid: userUID,
                    joinedAt: new Date().toLocaleString(),
                    status: "verified"
                });

                alert("Account Successfully Created!");
                window.location.reload(); 
            } catch (e) {
                alert("Firebase Error: " + e.message);
            }
        }
    </script>
</body>
</html>
