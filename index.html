<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Vault - Platform Tags</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #050505; color: #fff; }
        .glass-card { background: #111; border: 1px solid #222; border-radius: 20px; }
        .tag-btn { background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 12px; font-size: 10px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.2s; }
        .tag-btn:active { background: #eab308; color: #000; border-color: #eab308; }
        .tag-selected { border-color: #eab308; background: #2a2a10; color: #eab308; }
        .hidden { display: none; }
        input, textarea { background: #000 !important; border: 1px solid #333 !important; color: #fff !important; padding: 12px; border-radius: 10px; width: 100%; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body class="pb-32">
    <div class="max-w-md mx-auto p-5">
        
        <header class="py-6 border-b border-zinc-900 mb-6">
            <h1 class="text-xl font-black text-yellow-500 uppercase italic">Digital Inheritance</h1>
            <p class="text-[9px] text-zinc-500 tracking-widest uppercase">Secure Income Tags</p>
        </header>

        <div class="glass-card p-6 space-y-6">
            <h3 class="text-[10px] font-bold text-zinc-400 uppercase">1. Select Platform Category</h3>
            
            <div class="grid grid-cols-4 gap-2">
                <button onclick="showTags('crypto')" class="tag-btn"><i class="fa-solid fa-bitcoin-sign text-orange-500"></i>Crypto</button>
                <button onclick="showTags('social')" class="tag-btn"><i class="fa-solid fa-share-nodes text-pink-500"></i>Socials</button>
                <button onclick="showTags('work')" class="tag-btn"><i class="fa-solid fa-briefcase text-blue-500"></i>Work</button>
                <button onclick="showTags('system')" class="tag-btn"><i class="fa-solid fa-key text-yellow-500"></i>ID</button>
            </div>

            <div id="tag-container" class="hidden animate-fade-in">
                <h3 class="text-[10px] font-bold text-zinc-400 uppercase mb-3">2. Tag Specific Application</h3>
                <div id="tag-list" class="grid grid-cols-3 gap-2">
                    </div>
            </div>

            <div id="final-form" class="hidden">
                <h3 id="form-title" class="text-[10px] font-bold text-yellow-500 uppercase mb-3">3. Security Details</h3>
                <input type="text" id="asset-label" placeholder="Account Nickname (e.g. My Main Account)">
                <textarea id="asset-data" rows="3" placeholder="Enter Login/Seed Phrase/Backup Keys..."></textarea>
                <button onclick="saveAsset()" class="w-full bg-yellow-600 text-black font-black py-4 rounded-xl uppercase active:scale-95">Lock Asset</button>
            </div>
        </div>

        <div id="assets-display" class="mt-8 space-y-3">
             <h3 class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest px-2">Vaulted Assets</h3>
        </div>
    </div>

    <script>
        // CONFIG (Replace with your actual keys)
        const firebaseConfig = {
            apiKey: "AIzaSyBKWHEn8-x7KZXAcPDJWfceeNc1snOQuR0",
            authDomain: "amant-manger.firebaseapp.com",
            projectId: "amant-manger",
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let selectedPlatform = "";
        let selectedCategory = "";

        const platforms = {
            crypto: ['Binance', 'OKX', 'MetaMask', 'TrustWallet', 'ByBit', 'KuCoin'],
            social: ['YouTube', 'TikTok', 'Instagram', 'Facebook', 'X (Twitter)', 'Snapchat'],
            work: ['Upwork', 'Fiverr', 'Google AdSense', 'LinkedIn', 'Payoneer', 'PayPal'],
            system: ['Gmail', 'Apple ID', 'Outlook', 'iCloud', 'Microsoft']
        };

        function showTags(cat) {
            selectedCategory = cat;
            const container = document.getElementById('tag-container');
            const list = document.getElementById('tag-list');
            container.classList.remove('hidden');
            list.innerHTML = "";
            
            platforms[cat].forEach(p => {
                list.innerHTML += `<button onclick="selectTag('${p}')" id="tag-${p}" class="tag-btn border-zinc-800">${p}</button>`;
            });
        }

        function selectTag(p) {
            selectedPlatform = p;
            document.getElementById('final-form').classList.remove('hidden');
            document.getElementById('form-title').innerText = "Security Details for " + p;
            // Highlight selected
            document.querySelectorAll('#tag-list button').forEach(b => b.classList.remove('tag-selected'));
            document.getElementById('tag-' + p).classList.add('tag-selected');
        }

        function saveAsset() {
            const label = document.getElementById('asset-label').value;
            const data = document.getElementById('asset-data').value;
            if(!label || !data) return alert("Fill all info");
            
            const encrypted = CryptoJS.AES.encrypt(data, "USER_KEY_2026").toString();
            database.ref('vaults/' + auth.currentUser.uid).push({
                category: selectedCategory,
                platform: selectedPlatform,
                label: label,
                payload: encrypted,
                date: new Date().toLocaleDateString()
            }).then(() => {
                alert(selectedPlatform + " Secured!");
                location.reload();
            });
        }

        auth.onAuthStateChanged(user => {
            if(user) { fetchAssets(user.uid); }
            else { window.location.href = "index.html"; }
        });

        function fetchAssets(uid) {
            database.ref('vaults/' + uid).on('value', snap => {
                const display = document.getElementById('assets-display');
                snap.forEach(child => {
                    const item = child.val();
                    display.innerHTML += `
                        <div class="glass-card p-4 flex items-center justify-between border-l-2 border-yellow-600 mb-2">
                            <div>
                                <h4 class="text-[10px] font-black uppercase text-white">${item.platform} - ${item.label}</h4>
                                <p class="text-[8px] text-zinc-500 font-bold uppercase">${item.category} | ${item.date}</p>
                            </div>
                            <button onclick="deleteAsset('${child.key}')"><i class="fa-solid fa-trash-can text-zinc-800 text-xs"></i></button>
                        </div>
                    `;
                });
            });
        }

        function deleteAsset(key) { if(confirm("Delete?")) database.ref('vaults/' + auth.currentUser.uid + '/' + key).remove(); }
    </script>
</body>
</html>
