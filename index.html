<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANAT | Live Trustee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body class="bg-black text-gray-200 p-4">

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-4">
            <h1 class="text-4xl font-black text-yellow-500 italic">AMANAT</h1>
            <p class="text-[10px] text-gray-500 tracking-[0.3em]">SECURE DATABASE ACTIVE</p>
        </header>

        <section class="bg-zinc-900 p-6 rounded-[2.5rem] border border-zinc-800">
            <h3 class="text-yellow-500 font-bold mb-4 uppercase text-xs">Add Family Heir (Waris)</h3>
            <input type="text" id="heirName" placeholder="Full Name" class="w-full bg-black border border-zinc-800 p-3 rounded-xl mb-3 outline-none focus:border-yellow-500 text-sm">
            <input type="tel" id="heirPhone" placeholder="Mobile Number" class="w-full bg-black border border-zinc-800 p-3 rounded-xl mb-4 outline-none focus:border-yellow-500 text-sm">
            <button onclick="saveToFirebase()" class="w-full bg-yellow-600 py-3 rounded-xl font-bold text-black active:scale-95 transition-all">SAVE TO DATABASE</button>
        </section>

        <section id="dataList" class="space-y-3">
            <h3 class="text-gray-500 text-[10px] uppercase font-bold ml-2 tracking-widest">Saved Members</h3>
            </section>
    </div>

    <script>
        // Firebase Config (Using your Project ID)
        const firebaseConfig = {
            databaseURL: "https://amant-manger-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Save Function
        function saveToFirebase() {
            const name = document.getElementById('heirName').value;
            const phone = document.getElementById('heirPhone').value;

            if(name && phone) {
                database.ref('heirs/').push({
                    name: name,
                    phone: phone,
                    timestamp: Date.now()
                });
                alert("Data saved in Firebase successfully!");
                document.getElementById('heirName').value = "";
                document.getElementById('heirPhone').value = "";
            } else {
                alert("Please fill both fields!");
            }
        }

        // Real-time Show Data
        database.ref('heirs/').on('value', (snapshot) => {
            const dataList = document.getElementById('dataList');
            dataList.innerHTML = '<h3 class="text-gray-500 text-[10px] uppercase font-bold ml-2 tracking-widest">Saved Members</h3>';
            snapshot.forEach((childSnapshot) => {
                const childData = childSnapshot.val();
                dataList.innerHTML += `
                    <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800">
                        <p class="font-bold text-sm text-white">${childData.name}</p>
                        <p class="text-[10px] text-gray-500">${childData.phone}</p>
                    </div>`;
            });
        });
    </script>
</body>
</html>
